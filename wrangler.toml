name = "qxwk-blog"
main = "src/worker.js"
compatibility_date = "2026-08-05"

# 关闭默认域（*.workers.dev），只保留自定义域 blog.qxwkstudio.top
# 自定义域在控制台配置（Worker → 设置 → 触发器 → 自定义域），与 workers_dev 相互独立、不受影响；
# 这里仅停用 workers.dev 子域，避免出现第二个可访问入口。
workers_dev = false

# 静态资源目录（public/）
[assets]
directory = "public"

# 投稿数据：共用 qxwk-data 库（投稿表前缀 mg_，与站内其它业务区分）
[[d1_databases]]
binding = "DB"
database_name = "qxwk-data"
database_id = "60221417-13f8-486c-9f95-43e5fefe95d5"

# Worker 缓存（控制台「Cache / 缓存」），与 Qxwk-Account 保持一致
# enabled = true：为 Worker fetch handler 返回的响应启用边缘缓存，缓存与否由响应自带的
#   Cache-Control 决定。本站 /api/* 为 no-store，接口不进缓存；静态资源的缓存头由
#   public/_headers 分级控制（_headers 对静态资源生效——本仓库未设 run_worker_first）。
[cache]
enabled = true
