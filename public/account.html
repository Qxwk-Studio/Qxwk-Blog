<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 · 青翔未阔博客 - 青翔未阔工作室</title>
    <meta name="description" content="青翔未阔博客个人中心，由 Qxwk 通行证统一登录，查看投稿状态、管理通行证账号与退出登录。">
    <meta name="referrer" content="no-referrer">
    <link rel="icon" type="image/webp" href="/favicon.webp">
    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --primary: #2563eb; --primary-hover: #1d4ed8;
            --secondary: #0d9488;
            --surface: #ffffff; --bg: #f8fafc;
            --text-primary: #0f172a; --text-secondary: #64748b; --text-tertiary: #94a3b8;
            --border: #e2e8f0; --navbar-bg: rgba(255, 255, 255, 0.8);
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06); --shadow-md: 0 4px 16px rgba(0,0,0,0.08); --shadow-lg: 0 12px 40px rgba(0,0,0,0.12);
            --radius-sm: 8px; --radius-md: 14px;
            --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
            --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            --container: 1100px; --nav-height: 64px;
        }
        :root { color-scheme: light; --primary-subtle:rgba(37,99,235,0.08); }
        :root[data-theme="dark"] {
            --primary: #3b82f6; --primary-hover: #60a5fa;
            --secondary: #14b8a6;
            --surface: #1e293b; --bg: #0f172a;
            --text-primary: #e2e8f0; --text-secondary: #94a3b8; --text-tertiary: #64748b;
            --border: #334155; --navbar-bg: rgba(15,23,42,0.8);
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.4); --shadow-md: 0 4px 16px rgba(0,0,0,0.5); --shadow-lg: 0 12px 40px rgba(0,0,0,0.6);
        }
        :root[data-theme="dark"] .footer { background:#111827; }
        :root[data-theme="dark"] .back-link { background:rgba(59,130,246,0.16); border-color:rgba(96,165,250,0.35); }
        :root[data-theme="dark"] .back-link:hover { background:rgba(59,130,246,0.30); border-color:rgba(96,165,250,0.60); }
        :root[data-theme="dark"] .card, :root[data-theme="dark"] .sub-item { background:var(--surface); }
        :root[data-theme="dark"] .toast { background:var(--surface); }
        :root[data-theme="dark"] .profile-card {
            background: linear-gradient(135deg, color-mix(in srgb, var(--user-color, #2563eb) 18%, #0f172a), var(--surface) 80%);
            border-color: color-mix(in srgb, var(--user-color, #2563eb) 28%, #334155);
        }
        :root[data-theme="dark"] .card-logout {
            background:
                radial-gradient(120% 100% at 50% 0%, rgba(239,68,68,0.12) 0%, rgba(239,68,68,0) 60%),
                var(--surface);
            border-color: rgba(239,68,68,0.35);
        }

        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font-sans); background: var(--bg); color: var(--text-primary);
            line-height: 1.6; -webkit-font-smoothing: antialiased;
            min-height: 100vh; display: flex; flex-direction: column;
        }
        .navbar { position:sticky; top:0; width:100%; height:var(--nav-height); z-index:100;
            background:var(--navbar-bg); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
            border-bottom:1px solid var(--border); }
        .navbar-inner { max-width:var(--container); margin:0 auto; padding:0 24px;
            display:flex; align-items:center; justify-content:space-between; height:100%; }
        .navbar-brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--text-primary);
            font-weight:600; font-size:1.15rem; letter-spacing:0.3px; flex-shrink:0; }
        .brand-logo { width:34px; height:34px; border-radius:50%; flex-shrink:0; object-fit:cover;
            box-shadow:0 2px 10px rgba(37,99,235,0.25); }
        .brand-text { line-height: 1.25; }
        .brand-text b { display: block; font-size: 16px; font-weight: 600; letter-spacing: 0.3px; }
        .brand-text span { font-size: 11px; color: var(--text-tertiary); }
        .back-link { display:inline-flex; align-items:center; gap:6px; padding:8px 18px;
            background:rgba(37,99,235,0.15); color:var(--text-primary); text-decoration:none;
            border-radius:40px; font-size:0.88rem; font-weight:500;
            backdrop-filter:blur(4px); border:1px solid rgba(147,197,253,0.35);
            transition:all var(--transition); white-space:nowrap; }
        .back-link:hover { background:rgba(37,99,235,0.3); border-color:rgba(147,197,253,0.6); transform:scale(1.02); }
        .main { flex:1; padding:36px 24px 60px; }
        .container { max-width:var(--container); margin:0 auto; }
        .page-header { margin-bottom:28px; }
        .page-header h1 { font-size:clamp(1.5rem,3vw,2rem); font-weight:700; color:var(--text-primary);
            display:flex; align-items:center; gap:10px; }
        .page-header .tagline { font-size:0.95rem; color:var(--text-secondary); margin-top:8px; }

        .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
            padding:24px; box-shadow:var(--shadow-sm); margin-bottom:20px; }
        .card h3 { font-size:1.02rem; font-weight:600; margin-bottom:16px; }
        .profile-card { background: linear-gradient(135deg, color-mix(in srgb, var(--user-color,#2563eb) 15%, #ffffff), var(--surface) 80%);
            border-color: color-mix(in srgb, var(--user-color,#2563eb) 22%, #e2e8f0); }
        .profile-head { display:flex; align-items:flex-start; gap:18px; }
        .profile-avatar { width:60px; height:60px; border-radius:18px; flex-shrink:0; overflow:hidden;
            background:var(--primary); color:#fff; font-size:1.7rem; font-weight:700;
            display:flex; align-items:center; justify-content:center;
            box-shadow:0 6px 20px rgba(37,99,235,0.28); }
        .profile-avatar img { width:100%; height:100%; object-fit:cover; display:block; }
        .profile-info { flex:1; min-width:0; }
        .profile-name { font-size:1.4rem; font-weight:700; margin-bottom:4px; }
        .user-uid { font-family:'Consolas','Courier New',monospace; font-size:0.78rem; color:var(--text-tertiary); }
        .user-regtime { margin-top:6px; font-size:0.78rem; color:var(--text-tertiary); }
        .profile-meta { display:flex; align-items:center; gap:10px; margin-top:16px; padding-top:14px;
            border-top:1px solid var(--border); font-size:0.9rem; font-weight:500; color:var(--text-secondary); }
        .user-color-dot { width:18px; height:18px; border-radius:50%; border:2px solid #fff;
            box-shadow:0 0 0 1px var(--border); flex-shrink:0; }
        .admin-badge { flex-shrink:0; font-size:11px; font-weight:600; color:#fff;
            background:linear-gradient(135deg,#f59e0b,#d97706); border-radius:6px; padding:4px 10px; align-self:flex-start; }

        .layout { display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start; }
        .col { display:flex; flex-direction:column; gap:20px; }
        .col .card { margin-bottom:0; }

        .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; border:none; border-radius:40px;
            padding:10px 20px; font-size:0.9rem; font-weight:500; cursor:pointer; font-family:var(--font-sans);
            text-decoration:none; transition:all var(--transition); }
        .btn-primary { background:linear-gradient(135deg,var(--primary),var(--secondary)); color:#fff; }
        .btn-primary:hover { box-shadow:var(--shadow-md); transform:translateY(-1px); }
        .btn-ghost { background:var(--bg); color:var(--text-secondary); border:1px solid var(--border); }
        .btn-ghost:hover { background:var(--border); color:var(--text-primary); }
        .hint { font-size:0.78rem; color:var(--text-tertiary); margin-top:4px; }

        .sub-item { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
            padding:14px 16px; box-shadow:var(--shadow-sm); }
        .sub-item + .sub-item { margin-top:12px; }
        .row1 { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
        .title { font-size:0.98rem; font-weight:600; color:var(--text-primary); flex:1; min-width:0; }
        .meta { font-size:0.78rem; color:var(--text-tertiary); margin-top:8px; display:flex; gap:8px; flex-wrap:wrap; }
        .status { font-size:0.72rem; font-weight:600; padding:3px 10px; border-radius:40px; flex-shrink:0; }
        .status.pending { background:rgba(217,119,6,0.12); color:#b45309; }
        .status.approved { background:rgba(22,163,74,0.12); color:#15803d; }
        .status.rejected { background:rgba(239,68,68,0.12); color:#b91c1c; }
        .cat-chip { font-size:0.74rem; color:var(--primary); background:rgba(37,99,235,0.08); padding:2px 10px; border-radius:40px; }
        .review-note { margin-top:10px; padding:8px 12px; background:var(--bg); border:1px solid var(--border);
            border-radius:var(--radius-sm); font-size:0.8rem; color:var(--text-secondary); line-height:1.6; }
        .sub-item { cursor:pointer; transition:border-color var(--transition), box-shadow var(--transition); }
        .sub-item:hover { border-color:var(--primary); box-shadow:var(--shadow-md); }
        .sub-item:focus-visible { outline:2px solid var(--primary); outline-offset:1px; }
        .sub-item .view-hint { font-size:0.74rem; color:var(--primary); margin-top:10px; display:inline-flex;
            align-items:center; gap:4px; font-weight:500; }

        /* 正文只读弹窗（与审核页同风格） */
        .detail { display:none; position:fixed; inset:0; z-index:2500; background:rgba(15,23,42,0.6);
            backdrop-filter:blur(6px); justify-content:center; align-items:center; padding:24px; }
        .detail.active { display:flex; }
        .detail-dialog { background:var(--surface); border-radius:var(--radius-md); max-width:720px; width:100%;
            max-height:92vh; overflow-y:auto; box-shadow:var(--shadow-lg); animation:rdIn 0.25s ease; }
        @keyframes rdIn { from{transform:translateY(20px);opacity:0.5} to{transform:translateY(0);opacity:1} }
        .detail-head { display:flex; align-items:flex-start; gap:10px; padding:22px 26px; border-bottom:1px solid var(--border); }
        .detail-head h2 { font-size:1.25rem; font-weight:700; color:var(--text-primary); flex:1; line-height:1.3; margin:0; }
        .detail-close { background:none; border:none; cursor:pointer; width:34px; height:34px; font-size:1.6rem;
            line-height:1; color:var(--text-tertiary); border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
        .detail-close:hover { background:var(--bg); color:var(--text-primary); }
        .detail-meta { padding:12px 26px 0; font-size:0.8rem; color:var(--text-tertiary); display:flex; gap:12px; flex-wrap:wrap; }
        .detail-body { padding:16px 26px 0; }
        .b-label { font-size:0.78rem; font-weight:600; color:var(--text-secondary); margin-bottom:8px; }
        pre.wrap { white-space:pre-wrap; word-break:break-word; font-family:var(--font-sans); font-size:0.95rem; line-height:1.8; color:var(--text-primary); }
        .detail-contact { background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm);
            padding:10px 14px; font-size:0.85rem; color:var(--text-secondary); }
        .detail-foot { padding:18px 26px 24px; text-align:right; }
        :root[data-theme="dark"] .detail-dialog { background:var(--surface); }
        @media (max-width:640px) {
            .detail { padding:0; }
            .detail-dialog { border-radius:0; min-height:100vh; max-width:none; }
        }
        .empty { text-align:center; padding:40px 20px; color:var(--text-tertiary); font-size:0.9rem; }

        /* ===== 加载中：校验会话时的过渡界面 ===== */
        .loading-view { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
            gap:16px; padding:90px 20px; color:var(--text-secondary); font-size:0.92rem; }
        .loading-spinner { width:36px; height:36px; border-radius:50%;
            border:3px solid var(--border); border-top-color:var(--primary);
            animation:spin 0.9s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }

        .login-cta { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
            padding:60px 24px; text-align:center; box-shadow:var(--shadow-sm); }
        .login-cta h2 { font-size:1.35rem; color:var(--text-primary); margin-bottom:10px; }
        .login-cta p { color:var(--text-secondary); margin-bottom:24px; }

        /* 退出登录 */
        .card-logout { text-align:center;
            background:radial-gradient(120% 100% at 50% 0%, rgba(220,38,38,0.08) 0%, rgba(220,38,38,0) 60%), var(--surface);
            border:1px solid #fecaca; border-radius:var(--radius-md); padding:32px 26px; box-shadow:var(--shadow-sm); }
        .card-logout h3 { font-size:1.3rem; font-weight:700; color:var(--text-primary); margin-bottom:10px; }
        .logout-tip { font-size:0.86rem; color:var(--text-secondary); margin-bottom:20px; line-height:1.7; }
        .btn-logout { display:inline-flex; align-items:center; justify-content:center; gap:6px; width:100%;
            padding:11px 18px; border:none; border-radius:40px; font-size:0.9rem; font-weight:600; font-family:inherit;
            cursor:pointer; color:#fff; background:linear-gradient(135deg,#ef4444,#dc2626); transition:all var(--transition); }
        .btn-logout:hover { background:linear-gradient(135deg,#f87171,#ef4444); box-shadow:var(--shadow-md); transform:translateY(-1px); }
        .btn-logout svg { width:16px; height:16px; flex-shrink:0; }

        .theme-toggle { display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; padding:0; background:none; border:none; border-radius:50%; color:var(--text-primary); cursor:pointer; transition:background var(--transition), color var(--transition); }
        .theme-toggle:hover { background:var(--primary-subtle); color:var(--primary); }
        .theme-toggle svg { width:22px; height:22px; }
        .theme-toggle .icon-sun { display:none; }
        :root[data-theme="dark"] .theme-toggle .icon-sun { display:block; }
        :root[data-theme="dark"] .theme-toggle .icon-moon { display:none; }

        .toast { position:fixed; top:-60px; left:50%; transform:translateX(-50%);
            background:var(--surface); color:var(--text-primary); border:1px solid var(--border);
            padding:12px 24px; border-radius:var(--radius-sm); font-size:0.9rem; font-weight:500;
            z-index:3000; opacity:0; pointer-events:none;
            box-shadow:0 4px 20px rgba(0,0,0,0.1);
            display:flex; align-items:center; gap:10px;
            transition:top 0.35s ease, opacity 0.35s ease; }
        .toast svg { color:var(--primary); flex-shrink:0; }
        .toast.show { top:80px; opacity:1; }

        .footer { background:#0f172a; text-align:center; padding:28px 24px;
            color:var(--text-tertiary); font-size:0.85rem; border-top:1px solid rgba(255,255,255,0.06); }
        .footer-copy { opacity:0.6; }

        @media (max-width:640px) {
            .navbar-inner { padding:0 16px; }
            .main { padding:24px 16px 40px; }
            .card { padding:16px; }
            .profile-card { padding:18px; }
            .layout { grid-template-columns:1fr; }
            .back-link { padding:6px 12px; font-size:0.82rem; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
        }
    </style>
    <meta name="color-scheme" content="light dark">
    <script>
        (function () {
            var KEY = 'theme'; var root = document.documentElement; var mq = window.matchMedia('(prefers-color-scheme: dark)');
            function system() { return mq.matches ? 'dark' : 'light'; }
            function stored() { try { var v = localStorage.getItem(KEY); return (v === 'dark' || v === 'light') ? v : null; } catch (e) { return null; } }
            function apply(t) { root.setAttribute('data-theme', t); }
            function current() { return stored() || system(); }
            apply(current());
            function toggle() { var next = current() === 'dark' ? 'light' : 'dark'; apply(next); try { localStorage.setItem(KEY, next); } catch (e) {} }
            function bind() {
                var btn = document.getElementById('themeToggle');
                if (btn) btn.addEventListener('click', toggle);
                if (mq.addEventListener) mq.addEventListener('change', function (e) { if (!stored()) apply(e.matches ? 'dark' : 'light'); });
                else if (mq.addListener) mq.addListener(function (e) { if (!stored()) apply(e.matches ? 'dark' : 'light'); });
                window.addEventListener('storage', function (e) { if (e.key === KEY) apply(current()); });
            }
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind); else bind();
        })();
    </script>
</head>
<body>
    <header class="navbar">
        <div class="navbar-inner">
            <a href="https://blog.qxwkstudio.top/" class="navbar-brand">
                <img class="brand-logo" src="/favicon.webp" alt="青翔未阔工作室">
                <span class="brand-text"><b>青翔未阔博客</b><span>随心记录，定期成刊</span></span>
            </a>
            <div style="display:flex;align-items:center;gap:10px;">
                <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换主题" title="切换主题">
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
                <a href="https://blog.qxwkstudio.top/" class="back-link">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
                    返回博客
                </a>
            </div>
        </div>
    </header>

    <div class="main"><div class="container" id="app"><div class="loading-view"><div class="loading-spinner"></div><p>正在加载账号信息…</p></div></div></div>

    <footer class="footer">
        <div class="footer-copy">2026 青翔未阔工作室</div>
    </footer>

    <div class="toast" id="toast"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg><span id="toastText"></span></div>

    <!-- 正文只读弹窗 -->
    <div class="detail" id="detail">
        <div class="detail-dialog">
            <div class="detail-head">
                <h2 id="dTitle"></h2>
                <button type="button" class="detail-close" id="dClose" aria-label="关闭">×</button>
            </div>
            <div class="detail-meta" id="dMeta"></div>
            <div class="detail-body"><div class="b-label">正文</div><pre class="wrap" id="dBody"></pre></div>
            <div style="padding:14px 26px 0;" id="dContactWrap" hidden>
                <div class="b-label">联系方式</div><div class="detail-contact" id="dContact"></div>
            </div>
            <div class="detail-body" id="dNoteWrap" style="display:none;">
                <div class="b-label">审核意见</div><pre class="wrap" id="dNote" style="font-size:0.9rem;color:var(--text-secondary);"></pre>
            </div>
            <div class="detail-foot">
                <button type="button" class="btn btn-ghost" id="dCloseBtn">关闭</button>
            </div>
        </div>
    </div>

    <script>
        // ===== 通行证 SSO（弹窗登录）+ 调本站后端 =====
        var SUBMIT_API = 'https://blog.qxwkstudio.top';
        var MAG_TOKEN_KEY = 'qxwk_mag_token';

        function magToken() { return localStorage.getItem(MAG_TOKEN_KEY) || ''; }
        function esc(t) { var d = document.createElement('div'); d.textContent = t == null ? '' : t; return d.innerHTML; }
        function statusLabel(s) { return { pending: '待审核', approved: '已通过', rejected: '已驳回' }[s] || s; }
        // 后端以 SQLite datetime('now') 存 UTC（"YYYY-MM-DD HH:MM:SS"），在此转为本地时间
        function fmtTime(t) {
            if (!t) return '';
            var d = new Date(String(t).replace(' ', 'T') + 'Z');
            if (isNaN(d.getTime())) return String(t);
            var p = function (n) { return String(n).padStart(2, '0'); };
            return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' +
                p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
        }

        // 通行证登录（index 中控 · 统一分流）：整页跳转通行证主页 ?redirect= 本站，
        // 登录 + 授权确认由中控完成，确认后回跳本站 #_t=<token>（桌面/手机/微信一致，不受弹窗拦截）
        function passportLogin() {
            var here = location.origin + location.pathname;
            location.href = 'https://account.qxwkstudio.top/?redirect=' + encodeURIComponent(here);
        }
        // SSO 落地：读取 #_t=<token> 存入本地并清理地址栏
        (function () {
            var m = location.hash.match(/[#&]_t=([^&]+)/);
            if (!m) return;
            var t = decodeURIComponent(m[1]);
            try { localStorage.setItem(MAG_TOKEN_KEY, t); } catch (err) {}
            history.replaceState(null, '', location.pathname + location.search);
        })();

        function showToast(msg) {
            var el = document.getElementById('toast');
            document.getElementById('toastText').textContent = msg; el.classList.add('show');
            if (window._toastTimer) clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(function() { el.classList.remove('show'); }, 2500);
        }

        function magFetch(path, opts) {
            opts = opts || {};
            opts.headers = Object.assign({ 'Authorization': 'Bearer ' + magToken() }, opts.headers || {});
            if (opts.body) opts.headers['Content-Type'] = 'application/json';
            return fetch(SUBMIT_API + path, opts);
        }

        function clearSession() { try { localStorage.removeItem(MAG_TOKEN_KEY); } catch (e) {} }

        var app = document.getElementById('app');

        function renderLogin(msg) {
            app.innerHTML = '<div class="login-cta"><h2>' + (msg || '请先登录') + '</h2>' +
                '<p>查看投稿状态需使用通行证账号登录。</p>' +
                '<button type="button" class="btn btn-primary" onclick="passportLogin()">前往登录</button></div>';
        }

        function regText(t) {
            if (!t) return '';
            try { var d = new Date(String(t).replace(' ', 'T')); return isNaN(d.getTime()) ? String(t).slice(0,10) : '注册于 ' + d.toLocaleDateString('zh-CN'); }
            catch (e) { return ''; }
        }

        function render(me, subs) {
            // 专属颜色驱动主卡渐变背景
            if (me.color) document.documentElement.style.setProperty('--user-color', me.color);
            var avatarHtml = me.avatar
                ? '<img src="' + esc(me.avatar) + '" alt="头像" onerror="this.remove()">'
                : esc((me.nickname || '?').charAt(0).toUpperCase());

            var listHtml = '';
            if (subs && subs.length) {
                window._mySubs = subs; // 供只读弹窗读取正文
                subs.forEach(function (s) {
                    listHtml +=
                        '<div class="sub-item" role="button" tabindex="0" onclick="openSub(' + s.id + ')" ' +
                        'onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openSub(' + s.id + ');}">' +
                        '<div class="row1"><span class="status ' + s.status + '">' + statusLabel(s.status) + '</span>' +
                        '<span class="title">' + esc(s.title) + '</span>' +
                        (s.category ? '<span class="cat-chip">' + esc(s.category) + '</span>' : '') +
                        '</div>' +
                        '<div class="meta"><span>投稿于 ' + esc(fmtTime(s.created_at)) + '</span>' +
                        (s.reviewed_at ? '<span>· 审核于 ' + esc(fmtTime(s.reviewed_at)) + '</span>' : '') +
                        '</div>' +
                        (s.review_note ? '<div class="review-note"><b>审核意见：</b>' + esc(s.review_note) + '</div>' : '') +
                        '<span class="view-hint">' +
                        '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>' +
                        '查看正文</span>' +
                        '</div>';
                });
            } else {
                listHtml = '<div class="empty">还没有投稿，去投一篇吧</div>';
            }

            app.innerHTML =
                '<div class="page-header"><h1>' +
                '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>' +
                '个人中心</h1>' +
                '<div class="tagline">由 Qxwk 通行证统一登录，管理博客账号与投稿</div></div>' +

                '<div class="layout">' +
                '<div class="col">' +
                '<div class="card profile-card">' +
                '<div class="profile-head">' +
                '<div class="profile-avatar">' + avatarHtml + '</div>' +
                '<div class="profile-info">' +
                '<h2 class="profile-name">' + esc(me.nickname) + '</h2>' +
                '<div class="user-uid">UID：' + esc(me.userId) + '</div>' +
                '<div class="user-regtime">' + regText(me.created_at) + '</div>' +
                '</div>' +
                (me.is_admin ? '<span class="admin-badge">👑 管理员</span>' : '') +
                '</div>' +
                '<div class="profile-meta"><span class="user-color-dot" style="background:' + esc(me.color) + ';"></span>' +
                '<span>我的账号颜色</span></div>' +
                '</div>' +

                '<div class="card"><h3>📮 我的投稿</h3>' + listHtml + '</div>' +
                '</div>' +

                '<div class="col">' +
                '<div class="card"><h3>✍️ 继续投稿</h3>' +
                '<p class="hint">向《未阔月刊》投稿，提交后由管理员审核</p>' +
                '<a href="monthly/submit" class="btn btn-primary" style="margin-top:14px;width:100%;">去投稿</a></div>' +

                (me.is_admin ? '<div class="card"><h3>⚙️ 投稿审核</h3>' +
                    '<p class="hint">审核待通过稿件、填写审核意见（仅管理员可见）</p>' +
                    '<a href="monthly/review" class="btn btn-ghost" style="margin-top:14px;width:100%;">进入审核</a></div>' : '') +

                '<div class="card"><h3>🎫 通行证中心</h3>' +
                '<p class="hint">在通行证中心修改昵称 / 密码、管理账号</p>' +
                '<a href="https://account.qxwkstudio.top/account.html" target="_blank" rel="noopener" class="btn btn-ghost" style="margin-top:14px;width:100%;">打开通行证中心</a></div>' +

                '<div class="card-logout"><h3>退出登录</h3>' +
                '<div class="logout-tip">退出后在本站及其他已接入的站点都将需要重新登录</div>' +
                '<button class="btn-logout" onclick="logout()">' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>' +
                '退出登录</button></div>' +
                '</div>' +
                '</div>';
        }

        async function load() {
            var meRes = await magFetch('/api/me');
            if (meRes.status === 401) { clearSession(); renderLogin('登录已失效'); return; }
            var me = await meRes.json().catch(function () { return {}; });
            if (!me || !me.nickname) { renderLogin(); return; }

            var subRes = await magFetch('/api/my-submissions');
            var subs = [];
            if (subRes.ok) {
                var sdata = await subRes.json().catch(function () { return {}; });
                subs = sdata.submissions || [];
            }
            render(me, subs);
        }

        window.logout = function () {
            clearSession();
            location.reload(); // 重载本页后因无 token 显示登录入口
        };

        // 只读弹窗：打开 / 关闭
        function openSub(id) {
            var subs = window._mySubs || [];
            var s = null;
            for (var i = 0; i < subs.length; i++) { if (subs[i].id === id) { s = subs[i]; break; } }
            if (!s) return;
            document.getElementById('dTitle').innerHTML =
                '<span class="status ' + s.status + '" style="margin-right:10px;">' + statusLabel(s.status) + '</span>' +
                esc(s.title);
            document.getElementById('dMeta').innerHTML =
                '<span>分类：' + esc(s.category || '未填') + '</span><span>·</span><span>投稿于 ' + fmtTime(s.created_at) + '</span>' +
                (s.reviewed_at ? '<span>·</span><span>审核于 ' + fmtTime(s.reviewed_at) + '</span>' : '');
            document.getElementById('dBody').textContent = s.body || '（无正文）';
            document.getElementById('dContactWrap').hidden = !s.contact;
            if (s.contact) document.getElementById('dContact').textContent = s.contact;
            var noteWrap = document.getElementById('dNoteWrap');
            if (s.review_note) { noteWrap.style.display = 'block'; document.getElementById('dNote').textContent = s.review_note; }
            else noteWrap.style.display = 'none';
            document.getElementById('detail').classList.add('active');
        }
        function closeDetail() { document.getElementById('detail').classList.remove('active'); }
        document.getElementById('dClose').addEventListener('click', closeDetail);
        document.getElementById('dCloseBtn').addEventListener('click', closeDetail);
        document.getElementById('detail').addEventListener('click', function (e) { if (e.target === this) closeDetail(); });
        document.addEventListener('keydown', function (e) {
            if (document.getElementById('detail').classList.contains('active') && e.key === 'Escape') closeDetail();
        });

        function init() {
            if (!magToken()) { renderLogin(); return; }
            load();
        }

        init();
    </script>
</body>
</html>
