<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>未阔月刊 - 青翔未阔工作室</title>
    <meta name="description" content="《未阔月刊》——青翔未阔工作室的每月一刊，汇聚工作室博客、项目进展与成员随笔。">
    <link rel="icon" type="image/webp" href="/favicon.webp">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Reset / 设计变量 / body / 顶栏 / 品牌 / 主题按钮 / 底栏 / Toast 已抽到公共
           style.css，页面 <style> 在它之后加载，专有规则照常覆盖；本页仅保留专有部分 */

        .main { flex:1; padding:36px 24px 60px; }
        .container { max-width:var(--container); margin:0 auto; }
        .page-header { margin-bottom:32px; }
        /* 副标题（左下）与投稿按钮（右下）底部对齐：按钮贴在副标题同一行右侧 */
        .page-head-row { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; }
        .page-head-left { min-width:0; }
        /* .read-btn 自带 align-self:flex-start，会顶到行首；此处覆盖为贴底，与副标题对齐 */
        .page-head-row .read-btn { align-self:flex-end; flex-shrink:0; }
        /* 右上角按钮组：佳作集 + 投稿 */
        .page-head-actions { display:flex; align-items:flex-end; gap:10px; flex-shrink:0; }
        .page-header h1 { font-size:clamp(1.5rem,3vw,2rem); font-weight:700; color:var(--text-primary);
            display:flex; align-items:center; gap:10px; }
        .page-header .tagline { font-size:0.95rem; color:var(--text-secondary); margin-top:8px; }

        /* ===== Series overview ===== */
        .series-bar { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
            padding:18px 20px; margin-bottom:28px; box-shadow:var(--shadow-sm); }
        .series-head { display:flex; align-items:center; justify-content:space-between; cursor:pointer; user-select:none; }
        .series-title { font-size:0.92rem; font-weight:600; color:var(--text-primary); display:flex; align-items:center; gap:8px; }
        .series-title .dot { display:inline-block; width:6px; height:6px; border-radius:50%;
            background:linear-gradient(135deg,var(--primary),var(--secondary)); }
        .series-toggle { display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px;
            border-radius:50%; background:var(--bg); border:1px solid var(--border); color:var(--text-secondary);
            transition:transform var(--transition), background var(--transition); }
        .series-bar.collapsed .series-toggle { transform:rotate(-90deg); }
        .series-body { overflow:hidden; max-height:1000px; transition:max-height 0.35s ease, margin-top 0.35s ease; }
        .series-bar.collapsed .series-body { max-height:0; margin-top:0; }
        .series-scroll { display:flex; flex-wrap:wrap; gap:10px; padding:14px 2px 4px; }
        .series-chip { display:flex; align-items:center; gap:10px; padding:10px 14px;
            background:var(--bg); border:1px solid var(--border); border-radius:12px; cursor:default;
            transition:transform var(--transition), border-color var(--transition), box-shadow var(--transition);
            flex:1 0 calc(33.333% - 7px); min-width:0; }
        .series-chip:hover { transform:translateY(-1px); border-color:var(--primary); box-shadow:var(--shadow-sm); }
        .series-chip .sc-icon { font-size:1.3rem; line-height:1; flex-shrink:0; }
        .series-chip .sc-info { min-width:0; flex:1; }
        .series-chip .sc-name { font-size:0.84rem; font-weight:600; color:var(--text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .series-chip .sc-meta { font-size:0.74rem; color:var(--text-tertiary); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .series-chip .sc-count { font-size:0.72rem; font-weight:600; padding:3px 8px; border-radius:40px;
            background:var(--primary-subtle); color:var(--primary); flex-shrink:0; white-space:nowrap; }
        .series-chip .sc-count.done { background:rgba(239, 68, 68, 0.12); color:#ef4444; }

        /* ===== Featured (latest issue) ===== */
        .featured { display:grid; grid-template-columns: 1.1fr 1fr; gap:0; margin-bottom:48px;
            background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
            overflow:hidden; box-shadow:var(--shadow-sm); transition:box-shadow var(--transition), transform var(--transition); }
        .featured:hover { box-shadow:var(--shadow-lg); transform:translateY(-2px); }
        .featured-cover { position:relative; min-height:260px; background:var(--bg); }
        .featured-cover img { width:100%; height:100%; object-fit:cover; display:block; position:absolute; inset:0; }
        .featured-cover .issue-badge { position:absolute; top:14px; left:14px; z-index:2;
            background:linear-gradient(135deg,var(--primary),var(--secondary)); color:#fff;
            font-size:0.72rem; font-weight:600; letter-spacing:0.5px; padding:4px 12px; border-radius:40px;
            box-shadow:var(--shadow-sm); }
        .featured-content { padding:28px 30px; display:flex; flex-direction:column; justify-content:center; }
        .featured-content .meta { display:flex; align-items:center; gap:10px; font-size:0.82rem;
            color:var(--text-tertiary); margin-bottom:10px; }
        .featured-content .meta .dot { width:3px; height:3px; border-radius:50%; background:var(--text-tertiary); }
        .featured-content .art-count { font-size:0.78rem; color:var(--text-tertiary); margin-bottom:6px; }
        .featured-content h2 { font-size:clamp(1.3rem,2.5vw,1.6rem); font-weight:700; color:var(--text-primary);
            margin-bottom:12px; line-height:1.3; }
        .featured-content .summary { font-size:0.92rem; color:var(--text-secondary); line-height:1.7; margin-bottom:22px; }
        .read-btn { display:inline-flex; align-items:center; gap:8px; align-self:flex-start;
            padding:10px 22px; background:linear-gradient(135deg,var(--primary),var(--secondary)); color:#fff;
            text-decoration:none; border-radius:40px; font-size:0.88rem; font-weight:500; cursor:pointer; border:none;
            transition:transform var(--transition), box-shadow var(--transition); }
        .read-btn:hover { transform:scale(1.03); box-shadow:0 6px 20px rgba(37,99,235,0.3); }
        /* 次级按钮（投稿）：不用渐变底色，避免与主按钮「佳作集」抢主次 */
        .read-btn.ghost { background:var(--surface); color:var(--primary); border:1px solid var(--border); }
        .read-btn.ghost:hover { box-shadow:var(--shadow-sm); }

        /* ===== Past issues ===== */
        .section-label { display:flex; align-items:center; gap:8px; font-size:1rem; font-weight:600;
            color:var(--text-primary); margin-bottom:18px; }
        .section-label .line { flex:1; height:1px; background:var(--border); }
        .issues-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
        .issue-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
            overflow:hidden; cursor:pointer; transition:transform var(--transition), box-shadow var(--transition);
            display:flex; flex-direction:column; }
        .issue-card:hover { transform:translateY(-3px); box-shadow:var(--shadow-md); }
        .issue-card .card-cover { position:relative; aspect-ratio:16/9; background:var(--bg); overflow:hidden; }
        .issue-card .card-cover img { width:100%; height:100%; object-fit:cover; display:block;
            transition:transform 0.3s ease; }
        .issue-card:hover .card-cover img { transform:scale(1.05); }
        .issue-card .card-num { position:absolute; top:10px; left:10px; z-index:2;
            background:rgba(15,23,42,0.7); color:#fff; backdrop-filter:blur(4px);
            font-size:0.7rem; font-weight:600; padding:3px 10px; border-radius:40px; }
        .issue-card .card-body { padding:16px 18px 18px; }
        .issue-card .card-date { font-size:0.78rem; color:var(--text-tertiary); margin-bottom:6px; }
        .issue-card .card-title { font-size:1.05rem; font-weight:600; color:var(--text-primary); margin-bottom:8px; }
        .issue-card .card-summary { font-size:0.84rem; color:var(--text-secondary); line-height:1.6;
            display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; line-clamp:2; overflow:hidden; }

        /* ===== States ===== */
        .loading-state { text-align:center; padding:80px 20px; color:var(--text-secondary); }
        .spinner { display:inline-block; width:22px; height:22px; margin-right:8px;
            border:2px solid var(--border); border-top-color:var(--primary); border-radius:50%;
            animation:spin 0.8s linear infinite; vertical-align:middle; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .empty-state { text-align:center; padding:80px 20px; color:var(--text-tertiary); font-size:0.95rem; }
        .error-msg { background:#fef2f2; border:1px solid #fecaca; color:#b91c1c;
            padding:14px 18px; border-radius:var(--radius-sm); margin-bottom:16px; font-size:0.88rem; }

        /* ===== Reader modal ===== */
        .reader { display:none; position:fixed; inset:0; z-index:2000; background:rgba(15,23,42,0.6);
            backdrop-filter:blur(6px); justify-content:center; align-items:flex-start; padding:28px 24px;
            overflow-y:auto; }
        .reader.active { display:flex; }
        .reader-dialog { background:var(--surface); border-radius:var(--radius-md); max-width:1200px; width:100%;
            margin:auto; box-shadow:var(--shadow-lg); animation:rdIn 0.25s ease; overflow:hidden; }
        @media (min-width:1200px) { .reader-dialog { max-width:1280px; } }
        @keyframes rdIn { from { transform:translateY(20px); opacity:0.5; } to { transform:translateY(0); opacity:1; } }
        .reader-head { position:relative; }
        .reader-cover { position:relative; aspect-ratio:16/5; background:var(--bg); overflow:hidden; }
        .reader-cover img { width:100%; height:100%; object-fit:cover; display:block; }
        .reader-cover::after { content:''; position:absolute; inset:0;
            background:linear-gradient(transparent 40%, rgba(0,0,0,0.55)); }
        .reader-titlewrap { position:absolute; bottom:0; left:0; right:0; padding:28px 36px; z-index:2; color:#fff; }
        .reader-titlewrap .meta { font-size:0.85rem; opacity:0.9; margin-bottom:8px; display:flex; align-items:center; gap:10px; }
        .reader-titlewrap h2 { font-size:clamp(1.5rem,3vw,2.1rem); font-weight:700; line-height:1.25; }
        .reader-close { position:absolute; top:16px; right:16px; z-index:3; background:rgba(15,23,42,0.5);
            color:#fff; border:none; border-radius:50%; width:40px; height:40px; cursor:pointer;
            display:flex; align-items:center; justify-content:center; transition:background var(--transition); }
        .reader-close:hover { background:rgba(15,23,42,0.8); }

        /* Reader body: TOC + article */
        .reader-body { display:flex; gap:0; }
        .reader-toc { flex-shrink:0; width:260px; padding:30px 20px 30px 32px; border-right:1px solid var(--border);
            position:sticky; top:0; align-self:flex-start; max-height:calc(100vh - 56px); overflow-y:auto; }
        /* 目录头：桌面端只是一行标题（toc-current / toc-arrow 隐藏），移动端才变成可点的下拉开关 */
        .reader-toc .toc-head { display:flex; align-items:center; gap:8px; width:100%; margin:0 0 14px; padding:0 0 0 4px;
            border:none; background:none; font-family:var(--font-sans); text-align:left; cursor:default; }
        .reader-toc .toc-label { font-size:0.78rem; font-weight:600; color:var(--text-tertiary); letter-spacing:0.5px; }
        .reader-toc .toc-current, .reader-toc .toc-arrow { display:none; }
        .reader-toc .toc-list { display:flex; flex-direction:column; gap:2px; }
        .toc-item { display:block; text-align:left; padding:9px 12px; background:none; border:none; cursor:pointer;
            border-radius:var(--radius-sm); font-size:0.86rem; color:var(--text-secondary); line-height:1.4;
            transition:all var(--transition); font-family:var(--font-sans); }
        .toc-item:hover { background:var(--primary-subtle); color:var(--primary); }
        .toc-item.active { background:linear-gradient(135deg,rgba(37,99,235,0.12),rgba(13,148,136,0.10)); color:var(--primary); font-weight:600; }
        .toc-item .toc-num { display:inline-block; width:20px; color:var(--text-tertiary); font-size:0.76rem; }
        .toc-item.active .toc-num { color:var(--primary); }

        .reader-article { flex:1; min-width:0; padding:30px 40px 44px; }
        .article-head { margin-bottom:22px; padding-bottom:14px; border-bottom:1px solid var(--border); }
        .article-head h3 { font-size:1.5rem; font-weight:700; color:var(--text-primary); margin-bottom:8px; }
        .article-head .art-meta { font-size:0.82rem; color:var(--text-tertiary); }
        .article-content p { font-size:1rem; color:var(--text-primary); line-height:1.95;
            white-space:pre-line; margin-bottom:16px; text-indent:2em; }
        .article-content p:last-child { margin-bottom:0; }
        /* Markdown 正文内的块级元素（h2/h3/列表/引用/代码/表格/图片） */
        .article-content h1, .article-content h2, .article-content h3, .article-content h4 {
            font-weight:700; color:var(--text-primary); line-height:1.4; margin:26px 0 12px; }
        .article-content h1 { font-size:1.35rem; }
        .article-content h2 { font-size:1.2rem; }
        .article-content h3 { font-size:1.08rem; }
        .article-content h4 { font-size:1rem; }
        .article-content ul, .article-content ol { margin:0 0 16px; padding-left:1.6em; }
        .article-content li { font-size:1rem; color:var(--text-primary); line-height:1.9; margin-bottom:4px; }
        .article-content li > ul, .article-content li > ol { margin:6px 0 0; }
        .article-content blockquote { margin:0 0 16px; padding:8px 16px; border-left:3px solid var(--border);
            background:var(--bg); border-radius:0 var(--radius-sm) var(--radius-sm) 0; color:var(--text-secondary); }
        .article-content blockquote p { text-indent:0; color:inherit; }
        .article-content pre { margin:0 0 16px; padding:14px 16px; background:var(--bg); border:1px solid var(--border);
            border-radius:var(--radius-sm); overflow-x:auto; }
        .article-content pre code { font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
            font-size:0.86rem; line-height:1.7; white-space:pre; text-indent:0; }
        .article-content code { font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
            font-size:0.9em; background:var(--bg); border:1px solid var(--border); border-radius:4px; padding:1px 5px; }
        .article-content pre code { background:none; border:none; padding:0; }
        .article-content img { max-width:100%; height:auto; border-radius:var(--radius-sm); margin:8px 0; }
        .article-content hr { border:none; border-top:1px solid var(--border); margin:26px 0; }
        .article-content table { width:100%; border-collapse:collapse; margin:0 0 16px; font-size:0.9rem; }
        .article-content th, .article-content td { border:1px solid var(--border); padding:8px 10px; text-align:left; }
        .article-content th { background:var(--bg); font-weight:600; }
        .article-content a { color:var(--primary); }
        /* HTML 篇：整篇自包含文档嵌在 iframe 里，固定高度 + 内部滚动（不依赖被嵌页面配合报高）。
           沙箱策略见 renderArticle 的 sandbox 属性 */
        .article-content .article-html { width:100%; height:75vh; border:1px solid var(--border);
            border-radius:var(--radius-sm); display:block; }
        .article-loading { text-align:center; padding:48px 20px; color:var(--text-secondary); font-size:0.88rem; }
        .article-error { background:#fef2f2; border:1px solid #fecaca; color:#b91c1c;
            padding:14px 18px; border-radius:var(--radius-sm); font-size:0.86rem; line-height:1.6; }
        .article-nav { display:flex; justify-content:space-between; gap:12px; margin-top:32px;
            padding-top:20px; border-top:1px solid var(--border); }
        .art-nav-btn { display:inline-flex; align-items:center; gap:6px; padding:8px 16px;
            background:var(--bg); border:1px solid var(--border); border-radius:40px; cursor:pointer;
            font-size:0.84rem; color:var(--text-secondary); font-family:var(--font-sans); transition:all var(--transition); }
        .art-nav-btn:hover:not(:disabled) { border-color:var(--primary); color:var(--primary); }
        .art-nav-btn:disabled { opacity:0.4; cursor:not-allowed; }
        .art-nav-btn .lbl { max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .art-share { display:inline-flex; align-items:center; gap:5px; margin-top:10px; padding:6px 14px;
            background:var(--bg); border:1px solid var(--border); border-radius:40px; cursor:pointer;
            font-size:0.78rem; color:var(--text-secondary); font-family:var(--font-sans); transition:all var(--transition); }
        .art-share:hover { color:var(--primary); border-color:var(--primary); }

        @media (max-width:900px) {
            .issues-grid { grid-template-columns:repeat(2,1fr); }
            .featured { grid-template-columns:1fr; }
            .featured-cover { min-height:200px; aspect-ratio:16/9; }
            .series-chip { flex:1 0 calc(50% - 5px); }
        }
        @media (max-width:640px) {
            .main { padding:24px 16px 40px; }
            /* 按钮组多了一个（佳作集），窄屏放不下就整行下移、右对齐 */
            .page-head-row { flex-wrap:wrap; }
            .page-head-actions { width:100%; justify-content:flex-end; }
            .series-bar { padding:14px 14px; margin-bottom:22px; }
            .series-chip { flex:1 0 100%; padding:8px 12px; }
            .issues-grid { grid-template-columns:1fr; gap:16px; }
            .featured-content { padding:22px 20px; }
            .reader { padding:0; }
            .reader-dialog { border-radius:0; min-height:100vh; }
            .reader-titlewrap { padding:20px 20px; }
            .reader-body { flex-direction:column; }
            /* 目录：移动端收成一个「点击展开」的下拉开关，不再横向滚动占宽度 */
            .reader-toc { width:100%; position:relative; max-height:none; overflow:visible;
                border-right:none; border-bottom:1px solid var(--border); padding:12px 16px; }
            .reader-toc .toc-head { cursor:pointer; gap:10px; padding:9px 12px; margin:0;
                border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--bg); }
            .reader-toc .toc-label { flex-shrink:0; }
            .reader-toc .toc-current { display:block; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis;
                white-space:nowrap; font-size:0.84rem; font-weight:500; color:var(--text-primary); }
            .reader-toc .toc-arrow { display:block; flex-shrink:0; font-size:0.8rem; color:var(--text-tertiary);
                transition:transform var(--transition); }
            .reader-toc.open .toc-arrow { transform:rotate(180deg); }
            .reader-toc .toc-list { display:none; }
            .reader-toc.open .toc-list { display:flex; flex-direction:column; gap:2px; position:absolute;
                left:16px; right:16px; top:calc(100% - 8px); z-index:6; max-height:min(50vh,320px); overflow-y:auto;
                padding:6px; background:var(--surface); border:1px solid var(--border);
                border-radius:var(--radius-sm); box-shadow:var(--shadow-md); }
            .toc-item { white-space:normal; flex-shrink:0; }
            .reader-article { padding:22px 20px 32px; }
        }
        </style>
    <meta name="color-scheme" content="light dark">
    <script>
    /* 主题切换：localStorage('theme') 优先，其次跟随系统 prefers-color-scheme；同步写入 <html> 的 data-theme 防闪烁 */
    (function () {
        var KEY = 'theme';
        var root = document.documentElement;
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        function system() { return mq.matches ? 'dark' : 'light'; }
        function stored() { try { var v = localStorage.getItem(KEY); return (v === 'dark' || v === 'light') ? v : null; } catch (e) { return null; } }
        function apply(t) { root.setAttribute('data-theme', t); }
        function current() { return stored() || system(); }
        apply(current());
        function toggle() { var next = current() === 'dark' ? 'light' : 'dark'; apply(next); try { localStorage.setItem(KEY, next); } catch (e) {} }
        function bind() {
            var btn = document.getElementById('themeToggle');
            if (btn) btn.addEventListener('click', toggle);
            if (mq.addEventListener) mq.addEventListener('change', function (e) { if (!stored()) apply(e.matches ? 'dark' : 'light'); });
            else if (mq.addListener) mq.addListener(function (e) { if (!stored()) apply(e.matches ? 'dark' : 'light'); });
            window.addEventListener('storage', function (e) { if (e.key === KEY) apply(current()); });
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind); else bind();
    })();
    </script>
    <style>
        /* 主题切换按钮与深色变量已抽到公共 style.css，本页仅保留专有元素的深色覆盖 */
        :root[data-theme="dark"] .error-msg, :root[data-theme="dark"] .article-error { background:rgba(239,68,68,0.12); border-color:rgba(239,68,68,0.35); color:#fca5a5; }
        :root[data-theme="dark"] .reader-cover img { filter:brightness(0.8); }
        :root[data-theme="dark"] .art-nav-btn { background:var(--bg); }
        :root[data-theme="dark"] .series-chip { background:rgba(30,41,59,0.7); }
        :root[data-theme="dark"] .series-chip .sc-count.done { background:rgba(239, 68, 68, 0.16); color:#fca5a5; }
    </style>
    <!-- Markdown 渲染用的 marked UMD（全局 window.marked）不在这里同步加载：
         它只在真正要显示正文时才需要，首屏加载它会白等，改由 loadMarked() 按需注入 -->

<body>
    <header class="navbar">
        <div class="navbar-inner">
            <a href="/" class="navbar-brand">
                <img class="brand-logo" src="/favicon.webp" alt="青翔未阔工作室">
                <span class="brand-text"><b>未阔月刊</b><span>随心记录，定期成刊</span></span>
            </a>

    <!-- Reader modal -->
    <div class="reader" id="reader">
        <div class="reader-dialog" id="readerDialog">
            <div class="reader-head">
                <div class="reader-cover" id="readerCover"></div>
                <button class="reader-close" id="readerClose" aria-label="关闭">

    <div class="toast" id="toast"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg><span id="toastText"></span></div>

    <!-- 正文渲染管线（esc / sanitizeHtml / loadMarked / renderMarkdown）与「佳作集」页共用 -->
    <script src="lib/magazine.js"></script>
    <script>
        var ISSUES_URL = 'issues.json';
        var DATA = null;
        var currentIssue = null;   // issue object
        var currentArtIdx = 0;     // index within issue.articles
        var articleCache = {};     // key: issueId + '/' + slug -> Promise<Markdown 正文文本>（存 Promise 才能合并并发请求）

        // 渲染管线来自 lib/magazine.js，取到本地名沿用，调用处不必改
        var esc = Mag.esc, loadMarked = Mag.loadMarked, renderMarkdown = Mag.renderMarkdown;

        function fmtDate(s) {
            var m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
            if (!m) return s;
            return m[1] + '年' + Number(m[2]) + '月' + Number(m[3]) + '日';
        }

        // ===== 本地内容路径 =====
        // 文章与封面已随站点一起放在 public/magazine/<期id>/ 下
        // 用相对路径（不带前导 /），兼容子路径部署（如 GitHub Pages 项目站点）
        // 文章文件扩展名由 article.type 决定：type: "html" 的篇取 .html（整篇由 iframe 承载，
        // 不做 Markdown 渲染），其余（含缺省）一律按 .md。slug 本身不带扩展名。
        function articleUrl(issue, article) {
            if (!issue || !article) return '';
            var ext = article.type === 'html' ? '.html' : '.md';
            return 'magazine/' + encodeURIComponent(issue.id) + '/' + encodeURIComponent(article.slug) + ext;
        }
        function coverUrl(issue) {
            if (!issue || !issue.cover) return '';
            return 'magazine/' + encodeURIComponent(issue.id) + '/' + encodeURIComponent(issue.cover);
        }

        // 保留兜底：若某资源显式写成完整 http(s) URL 则直用
        function isHttpUrl(s) { return /^https?:\/\//i.test(String(s || '')); }

        // 封面加载失败时隐藏 img，露出容器背景，避免裂图
        function coverFallback(el) { if (el) el.style.opacity = '0'; }

        // ===== Markdown 渲染 =====
        // 已抽到 lib/magazine.js：esc / resolveRel / sanitizeHtml / loadMarked / renderMarkdown。
        // 与「佳作集」页共用一份——sanitizeHtml 是安全边界，两处实现一旦漂移就等于留了个洞。

        // 封面为站点内静态资源，直接交给 <img> 加载（失败时由 onerror → coverFallback 隐藏）
        // 若 cover 写成完整 http(s) URL 则直用
        function applyCoverToImg(imgEl, issue) {
            if (!imgEl || !issue || !issue.cover) return;
            imgEl.style.opacity = '';
            imgEl.src = isHttpUrl(issue.cover) ? issue.cover : coverUrl(issue);
        }

        // 获取单篇文章正文：本站静态资源（magazine/<期id>/<slug>.md）
        // 缓存的是 Promise 而非结果文本：同一篇被并发请求（预取 + 点开）时只发一次网络，后者复用同一 Promise；
        // 失败则删缓存，允许用户重试，不会把一次失败永久钉住
        function fetchArticle(issue, article) {
            if (!issue || !article) return Promise.reject(new Error('参数缺失'));
            var key = issue.id + '/' + article.slug;
            if (!articleCache[key]) {
                articleCache[key] = fetch(articleUrl(issue, article)).then(function (r) {
                    if (!r.ok) throw new Error('请求失败 (' + r.status + ')');
                    return r.text();
                }).catch(function (e) {
                    delete articleCache[key];
                    throw e;
                });
            }
            return articleCache[key];
        }

        // 文章正文所在目录（用于把正文里的相对插图路径补全），以 md 自身的 URL 目录为准
        function articleDir(issue, article) {
            var u = articleUrl(issue, article);
            return u ? u.slice(0, u.lastIndexOf('/') + 1) : '';
        }

        // 读到某篇时顺手预取下一篇：向前翻页不必等，又不一次预取整本、跟当前篇抢带宽
        function preloadNext(idx, total) {
            if (!currentIssue || idx + 1 >= total) return;
            var next = (currentIssue.articles || [])[idx + 1];
            // HTML 篇不需要预取：其正文由 iframe 自己加载，没必要拉文本
            if (next && next.type !== 'html') fetchArticle(currentIssue, next).catch(function () {});
        }

        async function loadIssues() {
            var container = document.getElementById('magContainer');
            try {
                var r = await fetch(ISSUES_URL, { cache: 'no-cache' });
                if (!r.ok) throw new Error('请求失败 (' + r.status + ')');
                DATA = await r.json();

                var mag = DATA.magazine || {};
                document.getElementById('magTagline').textContent = mag.tagline || '';
                document.title = (mag.name || '未阔月刊') + ' - 青翔未阔工作室';

                var issues = DATA.issues || [];
                if (!issues.length) {
                    container.innerHTML = '<div class="empty-state"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity:0.3;margin-bottom:12px;"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><div>月刊暂无内容</div></div>';
                    return;
                }
                renderMagazine(issues);

                // 首屏即预取最新一期的第一篇：点开阅读器时正文已到，不必等
                var latestArts = (issues[0] && issues[0].articles) || [];
                // HTML 篇不用预取正文（交给 iframe 自己加载）
                if (latestArts.length && latestArts[0].type !== 'html') fetchArticle(issues[0], latestArts[0]).catch(function () {});

                // 分享深链：?issue=<期id>&article=<序号> 自动打开阅读弹窗定位到该篇
                // article 只用文章序号（slug 的 "NN-" 前缀，如 01），链接更短
                var sp = new URLSearchParams(location.search);
                var issueParam = sp.get('issue');
                if (issueParam) {
                    for (var i = 0; i < issues.length; i++) {
                        if (String(issues[i].id) === String(issueParam)) {
                            // 先把 article 定位到索引，再一次性 openReader(i, startIdx)：
                            // 否则 openReader 内部会先渲染第 0 篇，深链再跳一次，白白多取一篇正文
                            var startIdx = 0;
                            var artParam = sp.get('article');
                            if (artParam) {
                                var arts = issues[i].articles || [];
                                for (var j = 0; j < arts.length; j++) {
                                    var s = String(arts[j].slug);
                                    // 契约：article 为文章序号（slug 的 "NN-" 前缀，如 01）
                                    if (s.split('-')[0] === String(artParam)) { startIdx = j; break; }
                                }
                            }
                            openReader(i, startIdx);
                            break;
                        }
                    }
                }
            } catch (e) {
                container.innerHTML = '<div class="error-msg">加载失败：' + esc(e.message) + '</div><div class="empty-state">请检查网络连接或稍后重试。</div>';
            }
        }

        function renderMagazine(issues) {
            var container = document.getElementById('magContainer');
            var latest = issues[0];
            var past = issues.slice(1);
            var html = '';

            // ===== Featured =====
            var arts = latest.articles || [];
            html += '<div class="featured" onclick="openReader(0)">';
            html += '  <div class="featured-cover">';
            html += '    <span class="issue-badge">最新一期 · 第' + esc(latest.number) + '期</span>';
            html += '    <img alt="' + esc(latest.title) + '封面" loading="eager" fetchpriority="high" onerror="coverFallback(this)" data-cover-issue="0">';
            html += '  </div>';
            html += '  <div class="featured-content">';
            html += '    <div class="meta"><span>' + fmtDate(latest.date) + '</span><span class="dot"></span><span>第' + esc(latest.number) + '期</span></div>';
            html += '    <div class="art-count">共 ' + arts.length + ' 篇</div>';
            html += '    <h2>' + esc(latest.title) + '</h2>';
            html += '    <div class="summary">' + esc(latest.summary) + '</div>';
            html += '    <button class="read-btn">阅读本期 <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>';
            html += '  </div>';
            html += '</div>';

            // ===== Past issues =====
            if (past.length) {
                html += '<div class="section-label"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>往期回看<span class="line"></span></div>';
                html += '<div class="issues-grid">';
                for (var i = 0; i < past.length; i++) {
                    var is = past[i];
                    var idx = i + 1;
                    var ac = (is.articles || []).length;
                    html += '<div class="issue-card" onclick="openReader(' + idx + ')">';
                    html += '  <div class="card-cover">';
                    html += '    <span class="card-num">第' + esc(is.number) + '期</span>';
                    html += '    <img alt="' + esc(is.title) + '封面" loading="lazy" onerror="coverFallback(this)" data-cover-issue="' + idx + '">';
                    html += '  </div>';
                    html += '  <div class="card-body">';
                    html += '    <div class="card-date">' + fmtDate(is.date) + ' · 共 ' + ac + ' 篇</div>';
                    html += '    <div class="card-title">' + esc(is.title) + '</div>';
                    html += '    <div class="card-summary" title="' + esc(is.summary) + '">' + esc(is.summary) + '</div>';
                    html += '  </div>';
                    html += '</div>';
                }
                html += '</div>';
            }

            container.innerHTML = html;

            // 封面为站点内静态资源，解析完成后异步填入 <img>.src
            for (var j = 0; j < issues.length; j++) {
                var imgs = container.querySelectorAll('img[data-cover-issue="' + j + '"]');
                for (var k = 0; k < imgs.length; k++) applyCoverToImg(imgs[k], issues[j]);
            }
        }

        // ===== Reader =====
        // startIdx：深链定位时直接打开指定篇，省掉「先渲染第 0 篇再跳」的重复取文
        function openReader(issueIndex, startIdx) {
            var issue = DATA.issues[issueIndex];
            if (!issue) return;
            currentIssue = issue;
            currentArtIdx = 0;

            document.getElementById('readerCover').innerHTML = '<img alt="' + esc(issue.title) + '封面" onerror="coverFallback(this)" id="readerCoverImg">';
            document.getElementById('readerTitlewrap').innerHTML =
                '<div class="meta"><span>第' + esc(issue.number) + '期</span><span>·</span><span>' + fmtDate(issue.date) + '</span></div>' +
                '<h2>' + esc(issue.title) + '</h2>';

            // 构建目录
            var arts = issue.articles || [];
            var tocHtml = '';
            for (var i = 0; i < arts.length; i++) {
                tocHtml += '<button class="toc-item" data-idx="' + i + '" onclick="selectArticle(' + i + ')">' +
                    '<span class="toc-num">' + (i + 1) + '</span>' + esc(arts[i].title) + '</button>';
            }
            document.getElementById('tocList').innerHTML = tocHtml;
            // 重开阅读器时目录默认收起，篇名先置为首篇（无文章则清空，避免残留上一期）
            var tocCur = document.getElementById('tocCurrent');
            if (tocCur) tocCur.textContent = arts[0] ? (arts[0].title || '') : '';
            closeToc();

            document.getElementById('reader').classList.add('active');
            document.body.style.overflow = 'hidden';
            document.getElementById('reader').scrollTop = 0;

            // 弹窗封面异步加载
            applyCoverToImg(document.getElementById('readerCoverImg'), issue);

            // 进阅读器就必然要渲染正文，marked 与文章并行下载，别串在后面等；
            // 正文本身由下面的 selectArticle 按需取，读到哪篇再预取下一篇（见 preloadNext）
            loadMarked();

            if (arts.length) selectArticle(startIdx || 0);
            else document.getElementById('articleArea').innerHTML = '<div class="article-loading">本期暂无文章</div>';
        }

        function selectArticle(idx) {
            if (!currentIssue) return;
            var arts = currentIssue.articles || [];
            if (idx < 0 || idx >= arts.length) return;
            currentArtIdx = idx;

            // 高亮目录项
            var items = document.getElementById('tocList').querySelectorAll('.toc-item');
            for (var i = 0; i < items.length; i++) {
                items[i].classList.toggle('active', Number(items[i].dataset.idx) === idx);
            }

            // 移动端：下拉开关上显示当前篇名，选中后自动收起
            var cur = document.getElementById('tocCurrent');
            if (cur) cur.textContent = arts[idx].title || '';
            closeToc();

            var area = document.getElementById('articleArea');
            var article = arts[idx];
            area.innerHTML = '<div class="article-loading"><span class="spinner"></span>正在加载文章</div>';

            // HTML 篇整篇交给 iframe 渲染，不走 fetch + marked
            if (article.type === 'html') {
                renderArticle(article, null, idx, arts.length);
                preloadNext(idx, arts.length);
                return;
            }

            fetchArticle(currentIssue, article).then(async function (md) {
                await loadMarked(); // 正文要用 marked 渲染，这里再等它到货
                renderArticle(article, md, idx, arts.length);
                preloadNext(idx, arts.length); // 渲染完成后再预取下一篇，占住阅读空档
            }).catch(function (e) {
                var url = articleUrl(currentIssue, article);
                var tip = url ? ('预期路径：<br><code style="word-break:break-all;">' + esc(url) + '</code>') : '';
                area.innerHTML = '<div class="article-error">文章加载失败：' + esc(e.message) + '<br>可能尚未上传至仓库。' + tip + '</div>';
                renderNav(idx, arts.length);
            });
        }

        // 标题与作者以 issues.json 为准（正文 md 只放正文），md 内容经 marked 渲染 + 消毒
        function renderArticle(article, md, idx, total) {
            var area = document.getElementById('articleArea');
            var title = article.title || '';
            var author = article.author || '';
            var metaParts = [];
            if (author) metaParts.push('文 / ' + esc(author));
            metaParts.push(esc(currentIssue.title));
            metaParts.push('第' + (idx + 1) + ' / ' + total + ' 篇');
            var html = '<div class="article-head"><h3>' + esc(title) + '</h3>' +
                '<div class="art-meta">' + metaParts.join(' · ') + '</div>' +
                '<button type="button" class="art-share" onclick="shareArticle()">分享本篇</button></div>';
            var body;
            if (article.type === 'html') {
                // 整篇自包含文档：直接 iframe 加载 magazine/<期id>/<slug>.html，不经 marked。
                // sandbox 给脚本执行与弹窗能力，但不给「顶层导航」，避免被嵌页面顶掉整个阅读器
                body = '<iframe class="article-html" src="' + esc(articleUrl(currentIssue, article)) + '"' +
                    ' sandbox="allow-scripts allow-same-origin allow-popups" loading="lazy" title="' + esc(title) + '"></iframe>';
            } else {
                var rendered = renderMarkdown(md, articleDir(currentIssue, article));
                body = String(md || '').trim() ? rendered : '<p style="color:var(--text-tertiary);">（暂无正文）</p>';
            }
            html += '<div class="article-content">';
            html += body;
            html += '</div>';
            area.innerHTML = html;
            renderNav(idx, total);
            // 滚到文章顶部
            document.getElementById('reader').scrollTop = 0;
        }

        function renderNav(idx, total) {
            var area = document.getElementById('articleArea');
            var arts = currentIssue.articles;
            var prev = idx > 0 ? arts[idx - 1] : null;
            var next = idx < total - 1 ? arts[idx + 1] : null;
            var html = '<div class="article-nav">';
            html += '<button class="art-nav-btn" ' + (prev ? '' : 'disabled') + ' onclick="selectArticle(' + (idx - 1) + ')">' +
                '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>' +
                '<span class="lbl">' + (prev ? esc(prev.title) : '已是第一篇') + '</span></button>';
            html += '<button class="art-nav-btn" ' + (next ? '' : 'disabled') + ' onclick="selectArticle(' + (idx + 1) + ')">' +
                '<span class="lbl">' + (next ? esc(next.title) : '已是最后一篇') + '</span>' +
                '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>';
            html += '</div>';
            area.insertAdjacentHTML('beforeend', html);
        }

        // 分享本篇：生成 ?issue=<期id>&article=<序号> 深链
        // 基址取当前文档所在目录（new URL('.')）而非写死 location.origin + '/'：
        // 子路径部署（如 GitHub Pages 项目站点 /Qxwk-Blog/）时分享链接才不会丢掉前缀
        function shareArticle() {
            if (!currentIssue) return;
            var arts = currentIssue.articles || [];
            var a = arts[currentArtIdx];
            if (!a) return;
            // article 只取 slug 的序号前缀（01、02…），链接更短
            var url = new URL('.', location.href).href +
                '?issue=' + encodeURIComponent(currentIssue.id) +
                '&article=' + encodeURIComponent(String(a.slug).split('-')[0]);
            // 只复制链接，不调系统分享面板（与佳作集页分享按钮口径一致）
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(
                    function () { showToast('链接已复制'); },
                    function () { showToast('复制失败'); }
                );
            } else { showToast(url); }
        }

        // 移动端目录下拉：桌面端目录常驻，不收也不显示开关（toc-current / toc-arrow 被 CSS 隐藏）
        function closeToc() {
            var toc = document.getElementById('readerToc');
            if (toc) toc.classList.remove('open');
            var btn = document.getElementById('tocToggle');
            if (btn) btn.setAttribute('aria-expanded', 'false');
        }

        function closeReader() {
            document.getElementById('reader').classList.remove('active');
            document.body.style.overflow = '';
            currentIssue = null;
            closeToc();
        }

        // ===== Toast =====
        function showToast(msg) {
            var t = document.getElementById('toast');
            document.getElementById('toastText').textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(function () { t.classList.remove('show'); }, 2200);
        }

        document.getElementById('readerClose').addEventListener('click', closeReader);
        // 移动端目录开关：只有窄屏才有意义，桌面端目录常驻，点了不做切换
        document.getElementById('tocToggle').addEventListener('click', function () {
            if (!window.matchMedia('(max-width:640px)').matches) return;
            var toc = document.getElementById('readerToc');
            var open = toc.classList.toggle('open');
            this.setAttribute('aria-expanded', open ? 'true' : 'false');
        });
        document.getElementById('reader').addEventListener('click', function (e) {
            if (e.target === this) closeReader();
        });
        document.addEventListener('keydown', function (e) {
            if (!document.getElementById('reader').classList.contains('active')) return;
            if (e.key === 'Escape') closeReader();
            if ((e.key === 'ArrowLeft') && currentIssue && currentArtIdx > 0) selectArticle(currentArtIdx - 1);
            if ((e.key === 'ArrowRight') && currentIssue) {
                var arts = currentIssue.articles || [];
                if (currentArtIdx < arts.length - 1) selectArticle(currentArtIdx + 1);
            }
        });

        // 加载索引与系列数据
        loadIssues(); loadSeries();

        // 渲染库 marked 在首屏加载完成后再后台预热，不抢首屏带宽；等用户点开正文时它多半已就绪。
        // loadMarked 内部缓存同一个 Promise，openReader 里再调不会重复注入脚本。
        window.addEventListener('load', function () { loadMarked(); });

        // 加载系列卡片（同目录 series.json）
        async function loadSeries() {
            try {
                var r = await fetch('series.json', { cache: 'no-cache' });
                if (!r.ok) return;
                var data = JSON.parse(await r.text());
                if (!data || !data.series || !data.series.length) return;
                renderSeries(data.series);
            } catch(e) { /* series.json 缺失/解析失败则静默隐藏 */ }
        }
        function renderSeries(list) {
            var bar = document.getElementById('seriesBar');
            var box = document.getElementById('seriesScroll');
            if (!bar || !box) return;
            box.innerHTML = '';
            list.forEach(function (s) {
                var chip = document.createElement('div');
                chip.className = 'series-chip';
                var label = s.done ? '完结于' : '更新至';
                chip.title = s.name + ' · ' + label + ' ' + s.count + ' 期 · 最近：' + s.lastIssue;
                var countCls = 'sc-count' + (s.done ? ' done' : '');
                var countText = s.done ? ('完结于' + s.count + '期') : ('更新至' + s.count + '期');
                chip.innerHTML =
                    '<span class="sc-icon">' + (s.icon || '📖') + '</span>' +
                    '<div class="sc-info">' +
                        '<div class="sc-name">' + esc(s.name) + '</div>' +
                        '<div class="sc-meta">' + esc(s.lastIssue || '') + (s.lastTitle ? ' · ' + esc(s.lastTitle) : '') + '</div>' +
                    '</div>' +
                    '<span class="' + countCls + '">' + countText + '</span>';
                box.appendChild(chip);
            });
            bar.style.display = '';
            // 折叠交互
            var head = document.getElementById('seriesHead');
            function toggle() {
                var isCollapsed = bar.classList.toggle('collapsed');
                head.setAttribute('aria-expanded', isCollapsed ? 'false' : 'true');
            }
            head.addEventListener('click', toggle);
            head.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
            });
        }
    </script>
</body>
</html>
