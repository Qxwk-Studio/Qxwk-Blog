<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投稿 · 未阔月刊 - 青翔未阔工作室</title>
    <meta name="description" content="向《未阔月刊》投稿，提交后由管理员审核。">
    <meta name="referrer" content="no-referrer">
    <link rel="icon" type="image/webp" href="/favicon.webp">
    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --primary: #2563eb; --primary-hover: #1d4ed8;
            --secondary: #0d9488;
            --surface: #ffffff; --bg: #f8fafc;
            --text-primary: #0f172a; --text-secondary: #64748b; --text-tertiary: #94a3b8;
            --border: #e2e8f0; --navbar-bg: rgba(255, 255, 255, 0.8);
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06); --shadow-md: 0 4px 16px rgba(0,0,0,0.08); --shadow-lg: 0 12px 40px rgba(0,0,0,0.12);
            --radius-sm: 8px; --radius-md: 14px;
            --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
            --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            --container: 1100px; --nav-height: 64px;
        }
        :root { color-scheme: light; --primary-subtle:rgba(37,99,235,0.08); }
        :root[data-theme="dark"] {
            --primary: #3b82f6; --primary-hover: #60a5fa;
            --secondary: #14b8a6;
            --surface: #1e293b; --bg: #0f172a;
            --text-primary: #e2e8f0; --text-secondary: #94a3b8; --text-tertiary: #64748b;
            --border: #334155; --navbar-bg: rgba(15,23,42,0.8);
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.4); --shadow-md: 0 4px 16px rgba(0,0,0,0.5); --shadow-lg: 0 12px 40px rgba(0,0,0,0.6);
        }
        :root[data-theme="dark"] .footer { background:#111827; }
        :root[data-theme="dark"] .back-link { background:rgba(59,130,246,0.16); border-color:rgba(96,165,250,0.35); }
        :root[data-theme="dark"] .back-link:hover { background:rgba(59,130,246,0.30); border-color:rgba(96,165,250,0.60); }
        :root[data-theme="dark"] .form-card { background:var(--surface); }
        :root[data-theme="dark"] .field-input { background:var(--bg); }
        :root[data-theme="dark"] .field-input:focus { background:var(--surface); }
        :root[data-theme="dark"] .toast { background:var(--surface); }

        .theme-toggle { display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; padding:0; background:none; border:none; border-radius:50%; color:var(--text-primary); cursor:pointer; transition:background var(--transition), color var(--transition); }
        .theme-toggle:hover { background:var(--primary-subtle); color:var(--primary); }
        .theme-toggle svg { width:22px; height:22px; }
        .theme-toggle .icon-sun { display:none; }
        :root[data-theme="dark"] .theme-toggle .icon-sun { display:block; }
        :root[data-theme="dark"] .theme-toggle .icon-moon { display:none; }

        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font-sans); background: var(--bg); color: var(--text-primary);
            line-height: 1.6; -webkit-font-smoothing: antialiased;
            min-height: 100vh; display: flex; flex-direction: column;
        }
        .navbar { position:sticky; top:0; width:100%; height:var(--nav-height); z-index:100;
            background:var(--navbar-bg); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
            border-bottom:1px solid var(--border); }
        .navbar-inner { max-width:var(--container); margin:0 auto; padding:0 24px;
            display:flex; align-items:center; justify-content:space-between; height:100%; }
        .navbar-brand { display:flex; align-items:center; gap:10px; color:var(--text-primary); text-decoration:none;
            font-weight:600; font-size:1.15rem; letter-spacing:0.3px; }
        .brand-text { line-height: 1.25; }
        .brand-text b { display: block; font-size: 16px; font-weight: 600; letter-spacing: 0.3px; }
        .brand-text span { display: block; font-size: 11px; color: var(--text-tertiary); }
        .back-link { display:inline-flex; align-items:center; gap:6px; padding:8px 18px;
            background:rgba(37,99,235,0.15); color:var(--text-primary); text-decoration:none;
            border-radius:40px; font-size:0.88rem; font-weight:500;
            backdrop-filter:blur(4px); border:1px solid rgba(147,197,253,0.35);
            transition:all var(--transition); white-space:nowrap; }
        .back-link:hover { background:rgba(37,99,235,0.3); border-color:rgba(147,197,253,0.6); transform:scale(1.02); }
        .main { flex:1; padding:36px 24px 60px; }
        .container { max-width:var(--container); margin:0 auto; }
        .page-header { margin-bottom:24px; }
        .page-header h1 { font-size:clamp(1.5rem,3vw,2rem); font-weight:700; color:var(--text-primary);
            display:flex; align-items:center; gap:10px; }
        .page-header .tagline { font-size:0.95rem; color:var(--text-secondary); margin-top:8px; }

        .form-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
            padding:28px 30px; box-shadow:var(--shadow-sm); }
        .form-card label { display:block; font-size:0.84rem; font-weight:600; color:var(--text-secondary); margin:18px 0 8px; }
        .form-card label:first-child { margin-top:0; }
        .field-input { width:100%; padding:11px 13px; border:1px solid var(--border); border-radius:var(--radius-sm);
            font-size:0.92rem; color:var(--text-primary); background:var(--bg); font-family:var(--font-sans);
            transition:border-color var(--transition), box-shadow var(--transition); }
        .field-input:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(37,99,235,0.12); background:var(--surface); }
        textarea.field-input { min-height:200px; resize:none; overflow-y:hidden; line-height:1.7; }
        .form-tip { font-size:0.78rem; color:var(--text-tertiary); margin-top:14px; line-height:1.6; }
        .actions { display:flex; justify-content:flex-end; gap:10px; margin-top:22px; }
        .btn { display:inline-flex; align-items:center; justify-content:center; border:none; border-radius:40px;
            padding:10px 22px; font-size:0.9rem; font-weight:500; cursor:pointer; font-family:var(--font-sans);
            text-decoration:none; transition:all var(--transition); }
        .btn-primary { background:linear-gradient(135deg,var(--primary),var(--secondary)); color:#fff; }
        .btn-primary:hover { box-shadow:var(--shadow-md); }
        .btn-primary:disabled { opacity:0.6; cursor:not-allowed; }
        .btn-ghost { background:var(--bg); color:var(--text-secondary); border:1px solid var(--border); }
        .btn-ghost:hover { background:var(--border); color:var(--text-primary); }

        .login-cta { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
            padding:60px 24px; text-align:center; box-shadow:var(--shadow-sm); }
        .login-cta h2 { font-size:1.35rem; color:var(--text-primary); margin-bottom:10px; }
        .login-cta p { color:var(--text-secondary); margin-bottom:24px; }

        /* ===== 加载中：校验会话时的过渡界面 ===== */
        .loading-view { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
            gap:16px; padding:90px 20px; color:var(--text-secondary); font-size:0.92rem; }
        .loading-spinner { width:36px; height:36px; border-radius:50%;
            border:3px solid var(--border); border-top-color:var(--primary);
            animation:spin 0.9s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }

        .toast { position:fixed; top:-60px; left:50%; transform:translateX(-50%);
            background:var(--surface); color:var(--text-primary); border:1px solid var(--border);
            padding:12px 24px; border-radius:var(--radius-sm); font-size:0.9rem; font-weight:500;
            z-index:3000; opacity:0; pointer-events:none;
            box-shadow:0 4px 20px rgba(0,0,0,0.1);
            display:flex; align-items:center; gap:10px;
            transition:top 0.35s ease, opacity 0.35s ease; }
        .toast svg { color:var(--primary); flex-shrink:0; }
        .toast.show { top:80px; opacity:1; }

        .footer { background:#0f172a; text-align:center; padding:28px 24px;
            color:var(--text-tertiary); font-size:0.85rem; border-top:1px solid rgba(255,255,255,0.06); }
        .footer-copy { opacity:0.6; }

        @media (max-width:640px) {
            .navbar-inner { padding:0 16px; }
            .main { padding:24px 16px 40px; }
            .form-card { padding:22px 18px; }
        }
    </style>
    <meta name="color-scheme" content="light dark">
    <script>
        (function () {
            var KEY = 'theme'; var root = document.documentElement; var mq = window.matchMedia('(prefers-color-scheme: dark)');
            function system() { return mq.matches ? 'dark' : 'light'; }
            function stored() { try { var v = localStorage.getItem(KEY); return (v === 'dark' || v === 'light') ? v : null; } catch (e) { return null; } }
            function apply(t) { root.setAttribute('data-theme', t); }
            function current() { return stored() || system(); }
            apply(current());
            function toggle() { var next = current() === 'dark' ? 'light' : 'dark'; apply(next); try { localStorage.setItem(KEY, next); } catch (e) {} }
            function bind() {
                var btn = document.getElementById('themeToggle');
                if (btn) btn.addEventListener('click', toggle);
                if (mq.addEventListener) mq.addEventListener('change', function (e) { if (!stored()) apply(e.matches ? 'dark' : 'light'); });
                else if (mq.addListener) mq.addListener(function (e) { if (!stored()) apply(e.matches ? 'dark' : 'light'); });
                window.addEventListener('storage', function (e) { if (e.key === KEY) apply(current()); });
            }
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind); else bind();
        })();
    </script>
</head>
<body>
    <header class="navbar">
        <div class="navbar-inner">
            <a href="../.." class="navbar-brand">
                <img src="/favicon.webp" alt="青翔未阔工作室" width="28" height="28" style="border-radius:5px;flex-shrink:0;">
                <span class="brand-text"><b>未阔月刊</b><span>随心记录，定期成刊</span></span>
            </a>
            <div style="display:flex;align-items:center;gap:10px;">
                <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换主题" title="切换主题">
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
                <a href="../.." class="back-link">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
                    返回博客
                </a>
            </div>
        </div>
    </header>

    <div class="main"><div class="container" id="app"><div class="loading-view"><div class="loading-spinner"></div><p>正在加载投稿信息…</p></div></div></div>

    <footer class="footer">
        <div class="footer-copy">2026 青翔未阔工作室</div>
    </footer>

    <div class="toast" id="toast"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg><span id="toastText"></span></div>

    <script>
        // ===== 通行证 SSO（弹窗登录）+ 提交到本站后端 =====
        var SUBMIT_API = 'https://blog.qxwkstudio.top';
        var MAG_TOKEN_KEY = 'qxwk_mag_token';

        // SSO 整页回跳落地（微信等无法弹窗的环境）：URL 带 token 则存入并清理地址栏，刷新后进入登录态
        (function ssoLanding() {
            var params = new URLSearchParams(location.search);
            var t = params.get('token');
            if (!t) return;
            try { localStorage.setItem(MAG_TOKEN_KEY, t); } catch (e) {}
            history.replaceState(null, '', location.origin + location.pathname);
        })();

        function magToken() { return localStorage.getItem(MAG_TOKEN_KEY) || ''; }
        function esc(t) { var d = document.createElement('div'); d.textContent = t == null ? '' : t; return d.innerHTML; }

        // 通行证登录：电脑端弹窗（popup=1，登录后 postMessage 回传并关窗）；
        // 手机端（含微信）无法可靠使用弹窗回传，改整页跳转（登录后带 token 回跳本页，由 ssoLanding 落地）
        function passportLogin() {
            var ssoUrl = 'https://account.qxwkstudio.top/authorize.html?redirect=' +
                encodeURIComponent(location.origin + location.pathname);
            if (/(Android|iPhone|iPad|iPod|Mobile)/i.test(navigator.userAgent)) {
                location.href = ssoUrl;
                return;
            }
            var w = window.open(ssoUrl + '&popup=1', 'qxwk_sso', 'width=420,height=640');
            if (!w) alert('请允许浏览器弹出窗口，以便完成通行证登录');
        }
        // 监听通行证弹窗回传：type=qxwk-sso 且 origin 为通行证时落地登录并刷新
        window.addEventListener('message', function (e) {
            if (e.origin !== 'https://account.qxwkstudio.top') return;
            var d = e.data || {};
            if (d.type !== 'qxwk-sso' || !d.token) return;
            try { localStorage.setItem(MAG_TOKEN_KEY, d.token); } catch (err) {}
            location.reload();
        });

        function showToast(msg) {
            var el = document.getElementById('toast');
            document.getElementById('toastText').textContent = msg; el.classList.add('show');
            if (window._toastTimer) clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(function() { el.classList.remove('show'); }, 2500);
        }

        var app = document.getElementById('app');
        function renderLogin(msg) {
            app.innerHTML = '<div class="login-cta"><h2>' + (msg || '请先登录') + '</h2>' +
                '<p>投稿需使用通行证账号登录。</p>' +
                '<button type="button" class="btn btn-primary" onclick="passportLogin()">前往登录</button></div>';
        }
        function renderForm() {
            app.innerHTML =
                '<div class="page-header"><h1><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>向未阔月刊投稿</h1>' +
                '<div class="tagline">提交后由管理员审核，通过后将在新一期发布</div></div>' +
                '<div class="form-card">' +
                '<label for="subTitle">标题</label>' +
                '<input class="field-input" id="subTitle" maxlength="60" placeholder="请输入文章标题" autocomplete="off">' +
                '<label for="subCategory">系列（可选）</label>' +
                '<input class="field-input" id="subCategory" maxlength="30" placeholder="例如：XX研究所 / XX漫谈" autocomplete="off">' +
                '<label for="subBody">正文</label>' +
                '<textarea class="field-input" id="subBody" placeholder="支持换行，最多 20000 字"></textarea>' +
                '<label for="subContact">联系方式（可选）</label>' +
                '<input class="field-input" id="subContact" maxlength="100" placeholder="如果有不同的署名也请写在这里，否则我们将使用你的通行证昵称" autocomplete="off">' +
                '<p class="form-tip">投稿提交后不可修改或删除，请勿一稿多投。</p>' +
                '<div class="actions">' +
                '<button type="button" class="btn btn-ghost" id="subReset">清空</button>' +
                '<button type="button" class="btn btn-primary" id="subSubmit">提交投稿</button>' +
                '</div></div>';
            document.getElementById('subSubmit').addEventListener('click', doSubmit);
            document.getElementById('subReset').addEventListener('click', function () {
                document.querySelectorAll('.field-input').forEach(function (i) { i.value = ''; });
                var ta = document.getElementById('subBody');
                if (ta) adjustTextarea(ta);
            });
            var ta = document.getElementById('subBody');
            if (ta) {
                ta.addEventListener('input', function () { adjustTextarea(ta); });
                adjustTextarea(ta);
            }
        }

        function adjustTextarea(ta) {
            ta.style.height = 'auto';
            ta.style.height = ta.scrollHeight + 'px';
        }

        async function init() {
            if (!magToken()) { renderLogin(); return; }
            // 加载界面保持显示，先校验 token 有效再展示表单（失效的登录态提前提示）
            var res;
            try {
                res = await fetch(SUBMIT_API + '/api/me', { headers: { 'Authorization': 'Bearer ' + magToken() } });
            } catch (e) { renderForm(); return; }
            if (res.status === 401) {
                try { localStorage.removeItem(MAG_TOKEN_KEY); } catch (e) {}
                renderLogin('登录已失效');
                return;
            }
            renderForm();
        }

        async function doSubmit() {
            var title = document.getElementById('subTitle').value.trim();
            var category = document.getElementById('subCategory').value.trim();
            var body = document.getElementById('subBody').value.trim();
            var contact = document.getElementById('subContact').value.trim();
            if (!title) { showToast('请填写标题'); return; }
            if (!body) { showToast('请填写正文'); return; }

            var btn = document.getElementById('subSubmit');
            btn.disabled = true; btn.textContent = '提交中…';
            var res;
            try {
                res = await fetch(SUBMIT_API + '/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + magToken() },
                    body: JSON.stringify({ title: title, category: category, body: body, contact: contact }),
                });
            } catch (e) { btn.disabled = false; btn.textContent = '提交投稿'; showToast('网络错误，请重试'); return; }

            if (res.status === 401) {
                try { localStorage.removeItem(MAG_TOKEN_KEY); } catch (e) {}
                btn.disabled = false; btn.textContent = '提交投稿';
                showToast('登录已失效，请重新登录');
                setTimeout(function () { passportLogin(); }, 900);
                return;
            }
            var data = await res.json().catch(function () { return {}; });
            if (!res.ok) { btn.disabled = false; btn.textContent = '提交投稿'; showToast(data.error || '提交失败'); return; }
            document.querySelectorAll('.field-input').forEach(function (i) { i.value = ''; });
            btn.disabled = false; btn.textContent = '提交投稿';
            showToast('投稿成功，待管理员审核');
        }

        init();
    </script>
</body>
</html>
