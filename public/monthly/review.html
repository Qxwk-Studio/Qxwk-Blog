<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投稿审核 · 未阔月刊 - 青翔未阔工作室</title>
    <meta name="description" content="未阔月刊投稿审核，仅管理员可访问。">
    <meta name="referrer" content="no-referrer">
    <link rel="icon" type="image/webp" href="/favicon.webp">
    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --primary: #2563eb; --primary-hover: #1d4ed8;
            --secondary: #0d9488;
            --surface: #ffffff; --bg: #f8fafc;
            --text-primary: #0f172a; --text-secondary: #64748b; --text-tertiary: #94a3b8;
            --border: #e2e8f0; --navbar-bg: rgba(255, 255, 255, 0.8);
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06); --shadow-md: 0 4px 16px rgba(0,0,0,0.08); --shadow-lg: 0 12px 40px rgba(0,0,0,0.12);
            --radius-sm: 8px; --radius-md: 14px;
            --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
            --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            --container: 1100px; --nav-height: 64px;
        }
        :root { color-scheme: light; --primary-subtle:rgba(37,99,235,0.08); }
        :root[data-theme="dark"] {
            --primary: #3b82f6; --primary-hover: #60a5fa;
            --secondary: #14b8a6;
            --surface: #1e293b; --bg: #0f172a;
            --text-primary: #e2e8f0; --text-secondary: #94a3b8; --text-tertiary: #64748b;
            --border: #334155; --navbar-bg: rgba(15,23,42,0.8);
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.4); --shadow-md: 0 4px 16px rgba(0,0,0,0.5); --shadow-lg: 0 12px 40px rgba(0,0,0,0.6);
        }
        :root[data-theme="dark"] .footer { background:#111827; }
        :root[data-theme="dark"] .back-link { background:rgba(59,130,246,0.16); border-color:rgba(96,165,250,0.35); }
        :root[data-theme="dark"] .back-link:hover { background:rgba(59,130,246,0.30); border-color:rgba(96,165,250,0.60); }
        :root[data-theme="dark"] .tab { background:var(--surface); }
        :root[data-theme="dark"] .sub-item { background:var(--surface); }
        :root[data-theme="dark"] .detail-dialog { background:var(--surface); }
        :root[data-theme="dark"] .note-input { background:var(--bg); }
        :root[data-theme="dark"] .note-input:focus { background:var(--surface); }
        :root[data-theme="dark"] .toast { background:var(--surface); }

        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font-sans); background: var(--bg); color: var(--text-primary);
            line-height: 1.6; -webkit-font-smoothing: antialiased;
            min-height: 100vh; display: flex; flex-direction: column;
        }
        .navbar { position:sticky; top:0; width:100%; height:var(--nav-height); z-index:100;
            background:var(--navbar-bg); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
            border-bottom:1px solid var(--border); }
        .navbar-inner { max-width:var(--container); margin:0 auto; padding:0 24px;
            display:flex; align-items:center; justify-content:space-between; height:100%; }
        .navbar-brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--text-primary);
            font-weight:600; font-size:1.15rem; letter-spacing:0.3px; }
        .brand-text { line-height: 1.25; }
        .brand-text b { display: block; font-size: 16px; font-weight: 600; letter-spacing: 0.3px; }
        .brand-text span { display: block; font-size: 11px; color: var(--text-tertiary); }
        .back-link { display:inline-flex; align-items:center; gap:6px; padding:8px 18px;
            background:rgba(37,99,235,0.15); color:var(--text-primary); text-decoration:none;
            border-radius:40px; font-size:0.88rem; font-weight:500;
            backdrop-filter:blur(4px); border:1px solid rgba(147,197,253,0.35);
            transition:all var(--transition); white-space:nowrap; }
        .back-link:hover { background:rgba(37,99,235,0.3); border-color:rgba(147,197,253,0.6); transform:scale(1.02); }
        .main { flex:1; padding:36px 24px 60px; }
        .container { max-width:var(--container); margin:0 auto; }
        .page-header { margin-bottom:32px; }
        .page-header h1 { font-size:clamp(1.5rem,3vw,2rem); font-weight:700; color:var(--text-primary);
            display:flex; align-items:center; gap:10px; }
        .page-header .tagline { font-size:0.95rem; color:var(--text-secondary); margin-top:8px; }

        .tabs { display:flex; gap:8px; margin-bottom:22px; flex-wrap:wrap; }
        .tab { padding:8px 16px; border:1px solid var(--border); background:var(--surface); color:var(--text-secondary);
            border-radius:40px; font-size:0.85rem; font-weight:500; cursor:pointer; font-family:var(--font-sans);
            transition:all var(--transition); }
        .tab:hover { border-color:var(--primary); color:var(--primary); }
        .tab.active { background:linear-gradient(135deg,var(--primary),var(--secondary)); color:#fff; border-color:transparent; }

        .list { display:flex; flex-direction:column; gap:12px; }
        .sub-item { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
            padding:16px 18px; cursor:pointer; transition:box-shadow var(--transition), transform var(--transition), border-color var(--transition); }
        .sub-item:hover { box-shadow:var(--shadow-md); transform:translateY(-1px); border-color:var(--primary); }
        .row1 { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
        .title { font-size:1rem; font-weight:600; color:var(--text-primary); flex:1; min-width:0; }
        .meta { font-size:0.8rem; color:var(--text-tertiary); margin-top:8px; display:flex; gap:8px; flex-wrap:wrap; }
        .status { font-size:0.72rem; font-weight:600; padding:3px 10px; border-radius:40px; flex-shrink:0; }
        .status.pending { background:rgba(217,119,6,0.12); color:#b45309; }
        .status.approved { background:rgba(22,163,74,0.12); color:#15803d; }
        .status.rejected { background:rgba(239,68,68,0.12); color:#b91c1c; }
        .cat-chip { font-size:0.74rem; color:var(--primary); background:rgba(37,99,235,0.08); padding:2px 10px; border-radius:40px; }
        .empty, .denied, .login-cta { text-align:center; padding:80px 20px; color:var(--text-tertiary); }
        .login-cta h2 { font-size:1.4rem; color:var(--text-primary); margin-bottom:10px; }
        .login-cta p { color:var(--text-secondary); margin-bottom:24px; }
        .denied h2 { font-size:1.4rem; color:var(--text-primary); margin-bottom:10px; }
        .denied p { color:var(--text-secondary); margin-bottom:24px; }

        /* ===== 加载中：校验会话时的过渡界面 ===== */
        .loading-view { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
            gap:16px; padding:90px 20px; color:var(--text-secondary); font-size:0.92rem; }
        .loading-spinner { width:36px; height:36px; border-radius:50%;
            border:3px solid var(--border); border-top-color:var(--primary);
            animation:spin 0.9s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }

        .btn { display:inline-flex; align-items:center; justify-content:center; border:none; border-radius:40px;
            padding:10px 20px; font-size:0.9rem; font-weight:500; cursor:pointer; font-family:var(--font-sans);
            text-decoration:none; transition:all var(--transition); }
        .btn-primary { background:linear-gradient(135deg,var(--primary),var(--secondary)); color:#fff; }
        .btn-primary:hover { box-shadow:var(--shadow-md); }
        .btn-ghost { background:var(--surface); color:var(--text-secondary); border:1px solid var(--border); }
        .btn-ghost:hover { background:var(--border); color:var(--text-primary); }
        .btn.approve { background:linear-gradient(135deg,#16a34a,#15803d); color:#fff; }
        .btn.reject { background:linear-gradient(135deg,#ef4444,#dc2626); color:#fff; }

        .detail { display:none; position:fixed; inset:0; z-index:2500; background:rgba(15,23,42,0.6);
            backdrop-filter:blur(6px); justify-content:center; align-items:center; padding:24px; }
        .detail.active { display:flex; }
        .detail-dialog { background:var(--surface); border-radius:var(--radius-md); max-width:720px; width:100%;
            max-height:92vh; overflow-y:auto; box-shadow:var(--shadow-lg); animation:rdIn 0.25s ease; }
        @keyframes rdIn { from{transform:translateY(20px);opacity:0.5} to{transform:translateY(0);opacity:1} }
        .detail-head { display:flex; align-items:flex-start; gap:10px; padding:22px 26px; border-bottom:1px solid var(--border); }
        .detail-head h2 { font-size:1.25rem; font-weight:700; color:var(--text-primary); flex:1; line-height:1.3; }
        .detail-close { background:none; border:none; cursor:pointer; width:34px; height:34px; font-size:1.6rem;
            line-height:1; color:var(--text-tertiary); border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
        .detail-close:hover { background:var(--bg); color:var(--text-primary); }
        .detail-meta { padding:12px 26px 0; font-size:0.8rem; color:var(--text-tertiary); display:flex; gap:12px; flex-wrap:wrap; }
        .detail-body { padding:16px 26px 0; }
        .b-label { font-size:0.78rem; font-weight:600; color:var(--text-secondary); margin-bottom:8px; }
        pre.wrap { white-space:pre-wrap; word-break:break-word; font-family:var(--font-sans); font-size:0.95rem; line-height:1.8; color:var(--text-primary); }
        .detail-contact { background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm);
            padding:10px 14px; font-size:0.85rem; color:var(--text-secondary); }
        .detail-actions { padding:16px 26px 22px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:14px; }
        .note-input { flex:1; min-width:200px; padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius-sm);
            font-size:0.88rem; font-family:var(--font-sans); color:var(--text-primary); background:var(--bg); }
        .note-input:focus { outline:none; border-color:var(--primary); background:var(--surface); }

        .toast { position:fixed; top:-60px; left:50%; transform:translateX(-50%);
            background:var(--surface); color:var(--text-primary); border:1px solid var(--border);
            padding:12px 24px; border-radius:var(--radius-sm); font-size:0.9rem; font-weight:500;
            z-index:3000; opacity:0; pointer-events:none;
            box-shadow:0 4px 20px rgba(0,0,0,0.1);
            display:flex; align-items:center; gap:10px;
            transition:top 0.35s ease, opacity 0.35s ease; }
        .toast svg { color:var(--primary); flex-shrink:0; }
        .toast.show { top:80px; opacity:1; }

        .theme-toggle { display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; padding:0; background:none; border:none; border-radius:50%; color:var(--text-primary); cursor:pointer; transition:background var(--transition), color var(--transition); }
        .theme-toggle:hover { background:var(--primary-subtle); color:var(--primary); }
        .theme-toggle svg { width:22px; height:22px; }
        .theme-toggle .icon-sun { display:none; }
        :root[data-theme="dark"] .theme-toggle .icon-sun { display:block; }
        :root[data-theme="dark"] .theme-toggle .icon-moon { display:none; }

        .footer { background:#0f172a; text-align:center; padding:28px 24px;
            color:var(--text-tertiary); font-size:0.85rem; border-top:1px solid rgba(255,255,255,0.06); }
        .footer-copy { opacity:0.6; }

        @media (max-width:640px) {
            .navbar-inner { padding:0 16px; }
            .main { padding:24px 16px 40px; }
            .detail { padding:0; }
            .detail-dialog { border-radius:0; min-height:100vh; max-width:none; }
        }
    </style>
    <meta name="color-scheme" content="light dark">
    <script>
        (function () {
            var KEY = 'theme'; var root = document.documentElement; var mq = window.matchMedia('(prefers-color-scheme: dark)');
            function system() { return mq.matches ? 'dark' : 'light'; }
            function stored() { try { var v = localStorage.getItem(KEY); return (v === 'dark' || v === 'light') ? v : null; } catch (e) { return null; } }
            function apply(t) { root.setAttribute('data-theme', t); }
            function current() { return stored() || system(); }
            apply(current());
            function toggle() { var next = current() === 'dark' ? 'light' : 'dark'; apply(next); try { localStorage.setItem(KEY, next); } catch (e) {} }
            function bind() {
                var btn = document.getElementById('themeToggle');
                if (btn) btn.addEventListener('click', toggle);
                if (mq.addEventListener) mq.addEventListener('change', function (e) { if (!stored()) apply(e.matches ? 'dark' : 'light'); });
                else if (mq.addListener) mq.addListener(function (e) { if (!stored()) apply(e.matches ? 'dark' : 'light'); });
                window.addEventListener('storage', function (e) { if (e.key === KEY) apply(current()); });
            }
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind); else bind();
        })();
    </script>
</head>
<body>
    <header class="navbar">
        <div class="navbar-inner">
            <a href="../.." class="navbar-brand">
                <img src="/favicon.webp" alt="青翔未阔工作室" width="28" height="28" style="border-radius:5px;flex-shrink:0;">
                <span class="brand-text"><b>未阔月刊</b><span>随心记录，定期成刊</span></span>
            </a>
            <div style="display:flex;align-items:center;gap:10px;">
            <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换主题" title="切换主题">
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
            <a href="../.." class="back-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
                返回博客
            </a>
            </div>
        </div>
    </header>

    <div class="main"><div class="container" id="app"><div class="loading-view"><div class="loading-spinner"></div><p>正在加载审核信息…</p></div></div></div>

    <footer class="footer">
        <div class="footer-copy">2026 青翔未阔工作室</div>
    </footer>

    <!-- 详情 Modal -->
    <div class="detail" id="detail">
        <div class="detail-dialog">
            <div class="detail-head">
                <h2 id="dTitle"></h2>
                <button type="button" class="detail-close" id="dClose" aria-label="关闭">×</button>
            </div>
            <div class="detail-meta" id="dMeta"></div>
            <div class="detail-body"><div class="b-label">正文</div><pre class="wrap" id="dBody"></pre></div>
            <div style="padding:14px 26px 0;" id="dContactWrap" hidden>
                <div class="b-label">联系方式</div><div class="detail-contact" id="dContact"></div>
            </div>
            <div style="padding:14px 26px 0;">
                <div class="b-label">审核意见</div>
                <div class="detail-actions" style="padding:0;">
                    <input class="note-input" id="dNote" maxlength="1000" placeholder="审稿意见（可选）">
                    <button type="button" class="btn reject" id="dReject">驳回</button>
                    <button type="button" class="btn approve" id="dApprove">通过</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg><span id="toastText"></span></div>

    <script>
        // ===== 通行证 SSO（弹窗登录）+ 调本站后端 =====
        var SUBMIT_API = 'https://blog.qxwkstudio.top';
        var MAG_TOKEN_KEY = 'qxwk_mag_token';
        var curStatus = 'pending', curSub = null;

        function magToken() { return localStorage.getItem(MAG_TOKEN_KEY) || ''; }
        function esc(t) { var d = document.createElement('div'); d.textContent = t == null ? '' : t; return d.innerHTML; }
        function statusLabel(s) { return { pending: '待审核', approved: '已通过', rejected: '已驳回' }[s] || s; }
        // 后端以 SQLite datetime('now') 存 UTC（"YYYY-MM-DD HH:MM:SS"），在此转为本地时间
        function fmtTime(t) {
            if (!t) return '';
            var d = new Date(String(t).replace(' ', 'T') + 'Z');
            if (isNaN(d.getTime())) return String(t);
            var p = function (n) { return String(n).padStart(2, '0'); };
            return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' +
                p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
        }

        // 通行证登录（index 中控 · 统一分流）：整页跳转通行证主页 ?redirect= 本站，
        // 登录 + 授权确认由中控完成，确认后回跳本站 #_t=<token>（桌面/手机/微信一致，不受弹窗拦截）
        function passportLogin() {
            var here = location.origin + location.pathname;
            location.href = 'https://account.qxwkstudio.top/?redirect=' + encodeURIComponent(here);
        }
        // SSO 落地：读取 #_t=<token> 存入本地并清理地址栏
        (function () {
            var m = location.hash.match(/[#&]_t=([^&]+)/);
            if (!m) return;
            var t = decodeURIComponent(m[1]);
            try { localStorage.setItem(MAG_TOKEN_KEY, t); } catch (err) {}
            history.replaceState(null, '', location.pathname + location.search);
        })();

        function showToast(msg) {
            var el = document.getElementById('toast');
            document.getElementById('toastText').textContent = msg; el.classList.add('show');
            if (window._toastTimer) clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(function() { el.classList.remove('show'); }, 2500);
        }

        function magFetch(path, opts) {
            opts = opts || {};
            opts.headers = Object.assign({ 'Authorization': 'Bearer ' + magToken() }, opts.headers || {});
            if (opts.body) opts.headers['Content-Type'] = 'application/json';
            return fetch(SUBMIT_API + path, opts);
        }

        var app = document.getElementById('app');
        function renderLogin(msg) {
            app.innerHTML = '<div class="login-cta"><h2>' + (msg || '请先登录') + '</h2>' +
                '<p>投稿审核仅对管理员开放，需使用通行证账号登录。</p>' +
                '<button type="button" class="btn btn-primary" onclick="passportLogin()">前往登录</button></div>';
        }
        function renderDenied() {
            app.innerHTML = '<div class="denied"><h2>无权访问</h2><p>该页面仅对管理员开放，投稿审核由管理员处理。</p></div>';
        }
        function renderPanel() {
            app.innerHTML =
                '<div class="page-header"><h1><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>投稿审核</h1>' +
                '<div class="tagline">审核通过后请手动发布到 Qxwk-Files 并更新 issues.json</div></div>' +
                '<div class="tabs" id="tabs">' +
                '<button class="tab active" data-s="pending">待审核</button>' +
                '<button class="tab" data-s="approved">已通过</button>' +
                '<button class="tab" data-s="rejected">已驳回</button>' +
                '<button class="tab" data-s="all">全部</button>' +
                '</div><div class="list" id="list"></div>';
            document.getElementById('tabs').addEventListener('click', function (e) {
                var b = e.target.closest('.tab'); if (!b) return;
                curStatus = b.getAttribute('data-s');
                document.querySelectorAll('.tab').forEach(function (t) { t.classList.toggle('active', t === b); });
                loadSubs();
            });
            loadSubs();
        }

        async function init() {
            if (!magToken()) { renderLogin(); return; }
            var res = await magFetch('/api/me');
            if (res.status === 401) { try { localStorage.removeItem(MAG_TOKEN_KEY); } catch (e) {} renderLogin('登录已失效'); return; }
            var me = await res.json().catch(function () { return {}; });
            if (!me || !me.is_admin) { renderDenied(); return; }
            renderPanel();
        }

        async function loadSubs() {
            var list = document.getElementById('list');
            list.innerHTML = '<div class="empty">加载中…</div>';
            var url = curStatus === 'all' ? '/api/submissions' : '/api/submissions?status=' + curStatus;
            var res = await magFetch(url);
            if (res.status === 401) { try { localStorage.removeItem(MAG_TOKEN_KEY); } catch (e) {} showToast('登录已失效'); return; }
            var data = await res.json().catch(function () { return { submissions: [] }; });
            list.innerHTML = '';
            if (!data.submissions || !data.submissions.length) { list.innerHTML = '<div class="empty">暂无投稿</div>'; return; }
            data.submissions.forEach(function (s) {
                var el = document.createElement('div');
                el.className = 'sub-item';
                el.innerHTML =
                    '<div class="row1"><span class="status ' + s.status + '">' + statusLabel(s.status) + '</span>' +
                    '<span class="title">' + esc(s.title) + '</span>' +
                    (s.category ? '<span class="cat-chip">' + esc(s.category) + '</span>' : '') +
                    '</div>' +
                    '<div class="meta"><span>' + esc(s.nickname) + '</span><span>·</span><span>' + esc(fmtTime(s.created_at)) + '</span></div>';
                el.addEventListener('click', function () { openDetail(s.id); });
                list.appendChild(el);
            });
        }

        async function openDetail(id) {
            var res = await magFetch('/api/submission/' + id);
            if (res.status === 401) { showToast('登录已失效'); return; }
            var data = await res.json().catch(function () { return {}; });
            var s = data.submission; if (!s) return;
            curSub = s;
            document.getElementById('dTitle').innerHTML = '<span class="status ' + s.status + '" style="margin-right:10px;">' +
                statusLabel(s.status) + '</span>' + esc(s.title);
            document.getElementById('dMeta').innerHTML =
                '<span>投稿人：' + esc(s.nickname) + '</span><span>·</span><span>分类：' + esc(s.category || '未填') + '</span>' +
                '<span>·</span><span>' + esc(fmtTime(s.created_at)) + '</span>';
            document.getElementById('dBody').textContent = s.body || '';
            var cw = document.getElementById('dContactWrap');
            if (s.contact) { cw.hidden = false; document.getElementById('dContact').textContent = s.contact; }
            else cw.hidden = true;
            document.getElementById('dNote').value = s.review_note || '';
            var pending = s.status === 'pending';
            document.getElementById('dApprove').style.display = pending ? '' : 'none';
            document.getElementById('dReject').style.display = pending ? '' : 'none';
            document.getElementById('detail').classList.add('active');
        }
        function closeDetail() { document.getElementById('detail').classList.remove('active'); }

        async function doReview(status) {
            var note = document.getElementById('dNote').value.trim();
            var res = await magFetch('/api/submission/' + curSub.id, {
                method: 'PATCH',
                body: JSON.stringify({ status: status, review_note: note }),
            });
            if (res.status === 401) { showToast('登录已失效'); return; }
            closeDetail();
            loadSubs();
        }

        document.getElementById('dClose').addEventListener('click', closeDetail);
        document.getElementById('detail').addEventListener('click', function (e) { if (e.target === this) closeDetail(); });
        document.getElementById('dApprove').addEventListener('click', function () { doReview('approved'); });
        document.getElementById('dReject').addEventListener('click', function () { doReview('rejected'); });
        document.addEventListener('keydown', function (e) {
            if (document.getElementById('detail').classList.contains('active') && e.key === 'Escape') closeDetail();
        });

        init();
    </script>
</body>
</html>
