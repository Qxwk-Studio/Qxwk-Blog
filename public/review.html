<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投稿审核 · 未阔月刊 - 青翔未阔工作室</title>
    <meta name="description" content="未阔月刊投稿审核，仅编辑可访问。">
    <meta name="referrer" content="no-referrer">
    <link rel="icon" type="image/webp" href="/favicon.webp">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Reset / 设计变量 / body / 顶栏 / 主题按钮 / 底栏 / Toast 已抽到公共 style.css，
           页面 <style> 在它之后加载，专有规则照常覆盖；本页仅保留专有部分 */
        :root[data-theme="dark"] .tab { background:var(--surface); }
        :root[data-theme="dark"] .sub-item { background:var(--surface); }
        :root[data-theme="dark"] .gate-card { background:var(--surface); }
        :root[data-theme="dark"] .field-input { background:var(--bg); }
        :root[data-theme="dark"] .field-input:focus { background:var(--surface); }
        :root[data-theme="dark"] .note-input { background:var(--bg); }
        :root[data-theme="dark"] .note-input:focus { background:var(--surface); }

        .main { flex:1; padding:36px 24px 60px; }
        .container { max-width:var(--container); margin:0 auto; }
        .page-header { margin-bottom:24px; }
        .page-header h1 { font-size:clamp(1.5rem,3vw,2rem); font-weight:700; color:var(--text-primary);
            display:flex; align-items:center; gap:10px; }
        .page-header .tagline { font-size:0.95rem; color:var(--text-secondary); margin-top:8px; }

        /* ===== 口令门 ===== */
        .gate-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
            padding:40px 30px; box-shadow:var(--shadow-sm); max-width:420px; margin:8px auto 0; text-align:center; }
        .gate-card h2 { font-size:1.3rem; font-weight:700; color:var(--text-primary); margin-bottom:10px; }
        .gate-card p { font-size:0.9rem; color:var(--text-secondary); margin-bottom:22px; }
        /* 口令输入框：本页没有公共 .field-input 基样式，这里补全（此前仅浏览器默认样式，很素） */
        .gate-card .field-input { width:100%; padding:13px 16px; margin-bottom:14px; text-align:center;
            font-size:1rem; font-family:var(--font-sans); color:var(--text-primary); background:var(--bg);
            border:1.5px solid var(--border); border-radius:var(--radius-sm); letter-spacing:0.12em;
            transition:border-color var(--transition), box-shadow var(--transition), background var(--transition); }
        .gate-card .field-input::placeholder { letter-spacing:normal; color:var(--text-tertiary); }
        .gate-card .field-input:focus { outline:none; border-color:var(--primary); background:var(--surface);
            box-shadow:0 0 0 4px rgba(37,99,235,0.12); }
        .gate-card .btn { width:100%; }
        .gate-msg { font-size:0.84rem; color:#b91c1c; background:#fef2f2; border:1px solid #fecaca;
            border-radius:var(--radius-sm); padding:9px 12px; margin-bottom:16px; }
        :root[data-theme="dark"] .gate-msg { background:rgba(239,68,68,0.12); border-color:rgba(239,68,68,0.35); color:#fca5a5; }

        /* ===== 筛选 ===== */
        .tabs { display:flex; gap:8px; margin-bottom:22px; flex-wrap:wrap; }
        .tab { padding:8px 16px; border:1px solid var(--border); background:var(--surface); color:var(--text-secondary);
            border-radius:40px; font-size:0.85rem; font-weight:500; cursor:pointer; font-family:var(--font-sans);
            transition:all var(--transition); }
        .tab:hover { border-color:var(--primary); color:var(--primary); }
        .tab.active { background:linear-gradient(135deg,var(--primary),var(--secondary)); color:#fff; border-color:transparent; }

        /* ===== 列表 + 详情两栏 ===== */
        .review-layout { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.15fr); gap:20px; align-items:start; }
        .list { display:flex; flex-direction:column; gap:12px; }
        .sub-item { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
            padding:16px 18px; cursor:pointer; transition:box-shadow var(--transition), transform var(--transition), border-color var(--transition); }
        .sub-item:hover { box-shadow:var(--shadow-md); transform:translateY(-1px); border-color:var(--primary); }
        .sub-item.active { border-color:var(--primary); box-shadow:var(--shadow-md); }
        .row1 { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
        .title { font-size:1rem; font-weight:600; color:var(--text-primary); flex:1; min-width:0;
            overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .meta { font-size:0.8rem; color:var(--text-tertiary); margin-top:8px; display:flex; gap:8px; flex-wrap:wrap; }
        .id-tag { font-family:var(--font-mono); color:var(--text-secondary); }
        .status { font-size:0.72rem; font-weight:600; padding:3px 10px; border-radius:40px; flex-shrink:0; }
        .status.pending { background:rgba(217,119,6,0.12); color:#b45309; }
        .status.approved { background:rgba(22,163,74,0.12); color:#15803d; }
        .status.rejected { background:rgba(239,68,68,0.12); color:#b91c1c; }
        .cat-chip { font-size:0.74rem; color:var(--primary); background:var(--primary-subtle); padding:2px 10px; border-radius:40px; }
        .empty { text-align:center; padding:70px 20px; color:var(--text-tertiary); font-size:0.92rem;
            background:var(--surface); border:1px dashed var(--border); border-radius:var(--radius-md); }

        .detail-col { position:sticky; top:calc(var(--nav-height) + 16px);
            max-height:calc(100vh - var(--nav-height) - 32px); overflow-y:auto;
            background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
            box-shadow:var(--shadow-sm); }
        .detail-empty { padding:70px 20px; text-align:center; color:var(--text-tertiary); font-size:0.9rem; }
        .detail-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap;
            padding:20px 24px 14px; border-bottom:1px solid var(--border); }
        .detail-head h2 { font-size:1.2rem; font-weight:700; color:var(--text-primary); line-height:1.35; flex:1; min-width:0; }
        .detail-meta { padding:12px 24px 0; font-size:0.8rem; color:var(--text-tertiary);
            display:flex; gap:12px; flex-wrap:wrap; }
        .detail-sec { padding:16px 24px 0; }
        .b-label { font-size:0.78rem; font-weight:600; color:var(--text-secondary); margin-bottom:8px; }
        .detail-contact { background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm);
            padding:10px 14px; font-size:0.85rem; color:var(--text-secondary); word-break:break-word; }
        .detail-actions { padding:18px 24px 22px; display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap; }
        .note-input { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius-sm);
            font-size:0.88rem; font-family:var(--font-sans); color:var(--text-primary); background:var(--bg); }
        .note-input:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(37,99,235,0.12); background:var(--surface); }

        /* Markdown 渲染区（与投稿页预览同一套排版） */
        .md { font-size:0.95rem; line-height:1.8; color:var(--text-primary); word-break:break-word; }
        .md h1, .md h2, .md h3, .md h4 { margin:18px 0 10px; line-height:1.35; font-weight:700; }
        .md h1 { font-size:1.4rem; } .md h2 { font-size:1.2rem; } .md h3 { font-size:1.05rem; } .md h4 { font-size:0.98rem; }
        /* pre-line：md 里手动换的行照原样断行，与首页正文排版一致 */
        .md p { margin:0 0 12px; text-indent:2em; white-space:pre-line; }
        .md ul, .md ol { margin:0 0 12px; padding-left:1.6em; }
        .md li { margin:4px 0; }
        /* 引用块已有左内边距，内部段落不再重复首行缩进（与首页正文一致） */
        .md blockquote p { text-indent:0; }
        .md blockquote { margin:0 0 12px; padding:6px 14px; border-left:3px solid var(--primary);
            background:var(--primary-subtle); color:var(--text-secondary); border-radius:0 var(--radius-sm) var(--radius-sm) 0; }
        .md code { font-family:var(--font-mono); font-size:0.88em; background:var(--bg); border:1px solid var(--border);
            border-radius:4px; padding:1px 5px; }
        .md pre { background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm);
            padding:12px 14px; overflow:auto; margin:0 0 12px; }
        .md pre code { background:none; border:none; padding:0; }
        .md a { color:var(--primary); }
        .md hr { border:none; border-top:1px solid var(--border); margin:16px 0; }
        .md img { max-width:100%; }
        .md-plain { white-space:pre-wrap; word-break:break-word; font-family:var(--font-mono); font-size:0.88rem;
            color:var(--text-primary); margin:0; }

        .btn { display:inline-flex; align-items:center; justify-content:center; border:none; border-radius:40px;
            padding:9px 20px; font-size:0.88rem; font-weight:500; cursor:pointer; font-family:var(--font-sans);
            text-decoration:none; transition:all var(--transition); }
        .btn-primary { background:linear-gradient(135deg,var(--primary),var(--secondary)); color:#fff; }
        .btn-primary:hover { box-shadow:var(--shadow-md); }
        .btn-primary:disabled { opacity:0.6; cursor:not-allowed; }
        .btn-ghost { background:var(--bg); color:var(--text-secondary); border:1px solid var(--border); }
        .btn-ghost:hover { background:var(--border); color:var(--text-primary); }
        .btn.approve { background:linear-gradient(135deg,#16a34a,#15803d); color:#fff; }
        .btn.approve:hover { box-shadow:var(--shadow-md); }
        .btn.reject { background:linear-gradient(135deg,#ef4444,#dc2626); color:#fff; }
        .btn.reject:hover { box-shadow:var(--shadow-md); }
        .btn:disabled { opacity:0.6; cursor:not-allowed; }

        @media (max-width:640px) {
            .main { padding:24px 16px 40px; }
            .detail-head, .detail-meta, .detail-sec, .detail-actions { padding-left:18px; padding-right:18px; }
        }
    </style>
    <meta name="color-scheme" content="light dark">
    <script>
    /* 主题切换：localStorage('theme') 优先，其次跟随系统 prefers-color-scheme；同步写入 <html> 的 data-theme 防闪烁 */
    (function () {
        var KEY = 'theme';
        var root = document.documentElement;
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        function system() { return mq.matches ? 'dark' : 'light'; }
        function stored() { try { var v = localStorage.getItem(KEY); return (v === 'dark' || v === 'light') ? v : null; } catch (e) { return null; } }
        function apply(t) { root.setAttribute('data-theme', t); }
        function current() { return stored() || system(); }
        apply(current());
        function toggle() { var next = current() === 'dark' ? 'light' : 'dark'; apply(next); try { localStorage.setItem(KEY, next); } catch (e) {} }
        function bind() {
            var btn = document.getElementById('themeToggle');
            if (btn) btn.addEventListener('click', toggle);
            if (mq.addEventListener) mq.addEventListener('change', function (e) { if (!stored()) apply(e.matches ? 'dark' : 'light'); });
            else if (mq.addListener) mq.addListener(function (e) { if (!stored()) apply(e.matches ? 'dark' : 'light'); });
            window.addEventListener('storage', function (e) { if (e.key === KEY) apply(current()); });
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind); else bind();
    })();
    </script>
    <!-- defer：39KB 的渲染器不该阻塞口令门首屏；本页要解锁并拉到投稿后才渲染正文 -->
    <script src="vendor/marked.min.js" defer></script>
</head>
<body>
    <header class="navbar">
        <div class="navbar-inner">
            <a href="/" class="navbar-brand">
                <img class="brand-logo" src="/favicon.webp" alt="青翔未阔工作室">
                <span class="brand-text"><b>未阔月刊</b><span>随心记录，定期成刊</span></span>
            </a>
            <div class="navbar-right">
                <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换主题" title="切换主题">
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
                <a href="/" class="back-link">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
                    返回月刊
                </a>
            </div>
        </div>
    </header>

    <div class="main"><div class="container">
        <!-- 口令门：未通过口令前只显示这里 -->
        <div id="gateView" hidden></div>

        <!-- 审核面板：口令通过后显示 -->
        <div id="panelView" hidden>
            <div class="page-header">
                <h1>
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                    投稿审核
                </h1>
                <div class="tagline">审核通过后请手动把文章整理进新一期并更新 issues.json</div>
            </div>

            <div class="tabs" id="tabs">
                <button class="tab" data-s="all" type="button">全部</button>
                <button class="tab active" data-s="pending" type="button">待审</button>
                <button class="tab" data-s="approved" type="button">通过</button>
                <button class="tab" data-s="rejected" type="button">驳回</button>
            </div>

            <div class="review-layout">
                <div class="list-col"><div class="list" id="list"></div></div>
                <div class="detail-col" id="detailCol">
                    <div class="detail-empty">从左侧选择一条投稿查看详情</div>
                </div>
            </div>
        </div>
    </div></div>

    <footer class="footer"><div class="footer-copy">2026 青翔未阔工作室</div></footer>

    <div class="toast" id="toast"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg><span id="toastText"></span></div>

    <script>
        // ===== 口令（代替登录）=====
        // 键名固定为 qxwk-mg-review-token，后端以 Authorization: Bearer <口令> 校验
        var TOKEN_KEY = 'qxwk-mg-review-token';

        function token() { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } }
        function setToken(t) { try { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); } catch (e) {} }

        // 所有审核接口都要带口令；正文与列表都同源请求
        function api(path, opts) {
            opts = opts || {};
            opts.headers = Object.assign({ 'Authorization': 'Bearer ' + token() }, opts.headers || {});
            return fetch(path, opts);
        }

        // 任何请求收到 401：清掉本地口令，回到口令界面并提示
        function handle401() {
            setToken('');
            renderGate('口令无效或已失效');
        }

        // ===== 文本 / 消毒工具（与投稿页同一套）=====
        function esc(t) { var d = document.createElement('div'); d.textContent = t == null ? '' : t; return d.innerHTML; }

        // 渲染前先对 Markdown 源文本做 HTML 转义：marked 默认放行原始 HTML，
        // 投稿是陌生人写的，必须先把 & 和 < 转义掉，杜绝 <script> 之类注入。
        // 只转 & 和 <（足以阻断标签）——不能转 >：否则行首的引用标记（> ）会被换成 &gt;
        // 而失效，引用就渲染不出来。
        function escapeSource(md) {
            return String(md == null ? '' : md).replace(/&/g, '&amp;').replace(/</g, '&lt;');
        }

        function sanitizeHtml(html) {
            var box = document.createElement('div');
            box.innerHTML = html;
            var bad = ['script', 'style', 'iframe', 'object', 'embed', 'form', 'input', 'link', 'meta'];
            bad.forEach(function (tag) {
                var els = box.querySelectorAll(tag);
                for (var i = els.length - 1; i >= 0; i--) { if (els[i].parentNode) els[i].parentNode.removeChild(els[i]); }
            });
            var all = box.querySelectorAll('*');
            for (var k = 0; k < all.length; k++) {
                var el = all[k], attrs = el.attributes;
                for (var j = attrs.length - 1; j >= 0; j--) {
                    var name = attrs[j].name;
                    if (/^on/i.test(name)) { el.removeAttribute(name); continue; }
                    if (name === 'href' || name === 'src' || name === 'xlink:href') {
                        var v = String(attrs[j].value || '').replace(/\s+/g, '').toLowerCase();
                        if (v.indexOf('javascript:') === 0 || v.indexOf('data:text/html') === 0) el.removeAttribute(name);
                    }
                }
            }
            return box.innerHTML;
        }

        // marked 只 parse 一次；脚本没加载成功则退化成 <pre> 纯文本，不抛错
        function mdToHtml(md) {
            var src = escapeSource(md);
            if (window.marked && typeof window.marked.parse === 'function') {
                try { return sanitizeHtml(window.marked.parse(src)); } catch (e) { /* 落到下面的兜底 */ }
            }
            return '<pre class="md-plain">' + src + '</pre>';
        }

        function statusLabel(s) { return { pending: '待审核', approved: '已通过', rejected: '已驳回' }[s] || s; }
        function statusClass(s) { return (s === 'pending' || s === 'approved' || s === 'rejected') ? s : ''; }

        // 后端存 UTC 的 "YYYY-MM-DD HH:MM:SS"（Worker 用 toISOString 截取），在此转为本地时间
        function fmtTime(t) {
            if (!t) return '';
            var d = new Date(String(t).replace(' ', 'T') + 'Z');
            if (isNaN(d.getTime())) return String(t);
            var p = function (n) { return String(n).padStart(2, '0'); };
            return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' +
                p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
        }

        function showToast(msg) {
            var t = document.getElementById('toast');
            document.getElementById('toastText').textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(function () { t.classList.remove('show'); }, 2500);
        }

        // ===== 口令界面 =====
        var gateView = document.getElementById('gateView');
        var panelView = document.getElementById('panelView');

        function renderGate(msg) {
            panelView.hidden = true;
            gateView.hidden = false;
            gateView.innerHTML =
                '<div class="gate-card">' +
                    '<h2>投稿审核</h2>' +
                    '<p>审核仅对编辑开放，请输入审核口令进入。</p>' +
                    (msg ? '<div class="gate-msg">' + esc(msg) + '</div>' : '') +
                    '<input class="field-input" id="gateToken" type="password" placeholder="审核口令" autocomplete="current-password">' +
                    '<button type="button" class="btn btn-primary" id="gateEnter">进入</button>' +
                '</div>';
            var inp = document.getElementById('gateToken');
            var btn = document.getElementById('gateEnter');
            function enter() {
                var v = inp.value.trim();
                if (!v) { showToast('请输入审核口令'); inp.focus(); return; }
                setToken(v);
                showPanel();
            }
            btn.addEventListener('click', enter);
            inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') enter(); });
            inp.focus();
        }

        function showPanel() {
            gateView.hidden = true;
            gateView.innerHTML = '';
            panelView.hidden = false;
            curId = null;
            document.getElementById('detailCol').innerHTML = '<div class="detail-empty">从左侧选择一条投稿查看详情</div>';
            loadSubs();
        }

        // ===== 列表 =====
        var curStatus = 'pending';
        var curId = null;

        document.getElementById('tabs').addEventListener('click', function (e) {
            var b = e.target.closest('.tab');
            if (!b) return;
            curStatus = b.getAttribute('data-s');
            var tabs = document.querySelectorAll('.tab');
            for (var i = 0; i < tabs.length; i++) tabs[i].classList.toggle('active', tabs[i] === b);
            curId = null;
            document.getElementById('detailCol').innerHTML = '<div class="detail-empty">从左侧选择一条投稿查看详情</div>';
            loadSubs();
        });

        async function loadSubs() {
            var list = document.getElementById('list');
            list.innerHTML = '<div class="empty">加载中…</div>';
            try {
                var url = curStatus === 'all' ? '/api/submissions' : ('/api/submissions?status=' + encodeURIComponent(curStatus));
                var res = await api(url);
                if (res.status === 401) { handle401(); return; }
                var data = await res.json().catch(function () { return {}; });
                if (!res.ok) {
                    list.innerHTML = '<div class="empty">加载失败：' + esc(data.error || res.status) + '</div>';
                    return;
                }
                var subs = data.submissions || [];
                list.innerHTML = '';
                if (!subs.length) {
                    list.innerHTML = '<div class="empty">这里还没有投稿</div>';
                    return;
                }
                subs.forEach(function (s) {
                    var el = document.createElement('div');
                    el.dataset.id = s.id;
                    el.className = 'sub-item' + (s.id === curId ? ' active' : '');
                    el.innerHTML =
                        '<div class="row1">' +
                            '<span class="title">' + esc(s.title) + '</span>' +
                            '<span class="status ' + statusClass(s.status) + '">' + esc(statusLabel(s.status)) + '</span>' +
                        '</div>' +
                        '<div class="meta">' +
                            '<span class="id-tag">#' + esc(String(s.id)) + '</span>' +
                            '<span>作者：' + esc(s.author) + '</span>' +
                            (s.category ? '<span class="cat-chip">' + esc(s.category) + '</span>' : '') +
                            '<span>' + esc(fmtTime(s.created_at)) + '</span>' +
                        '</div>';
                    el.addEventListener('click', function () { openDetail(s.id); });
                    list.appendChild(el);
                });
            } catch (e) {
                list.innerHTML = '<div class="empty">网络错误，请重试</div>';
            }
        }

        // ===== 详情 =====
        async function openDetail(id) {
            var res = await api('/api/submission/' + id);
            if (res.status === 401) { handle401(); return; }
            var data = await res.json().catch(function () { return {}; });
            if (!res.ok || !data.submission) { showToast('加载详情失败'); return; }
            var s = data.submission;
            curId = s.id;

            var col = document.getElementById('detailCol');
            col.innerHTML =
                '<div class="detail-head">' +
                    '<span class="status ' + statusClass(s.status) + '">' + esc(statusLabel(s.status)) + '</span>' +
                    '<h2>' + esc(s.title) + '</h2>' +
                '</div>' +
                '<div class="detail-meta">' +
                    '<span>作者：' + esc(s.author) + '</span>' +
                    '<span>栏目：' + esc(s.category || '未填') + '</span>' +
                    '<span>提交：' + esc(fmtTime(s.created_at)) + '</span>' +
                    (s.reviewed_at ? '<span>审核：' + esc(fmtTime(s.reviewed_at)) + '</span>' : '') +
                '</div>' +
                '<div class="detail-sec"><div class="b-label">正文</div><div class="md">' + mdToHtml(s.body || '') + '</div></div>' +
                (s.contact ? '<div class="detail-sec"><div class="b-label">联系方式</div><div class="detail-contact">' + esc(s.contact) + '</div></div>' : '') +
                '<div class="detail-sec">' +
                    '<div class="b-label">审稿意见（0-500 字，可空）</div>' +
                    '<input class="note-input" id="dNote" maxlength="500" placeholder="审稿意见（可选）">' +
                '</div>' +
                '<div class="detail-actions">' +
                    '<button type="button" class="btn btn-ghost" data-act="pending">改回待审</button>' +
                    '<button type="button" class="btn reject" data-act="rejected">驳回</button>' +
                    '<button type="button" class="btn approve" data-act="approved">通过</button>' +
                '</div>';

            // 用 value 属性赋值而非拼进 innerHTML，避免审稿意见里的引号破坏标签
            document.getElementById('dNote').value = s.review_note || '';

            col.querySelectorAll('[data-act]').forEach(function (b) {
                b.addEventListener('click', function () { doReview(b.getAttribute('data-act'), b); });
            });

            // 高亮当前列表行
            var items = document.querySelectorAll('#list .sub-item');
            for (var i = 0; i < items.length; i++) items[i].classList.toggle('active', items[i].dataset.id === String(curId));
        }

        async function doReview(status, btnEl) {
            if (curId == null) return;
            var note = document.getElementById('dNote').value;
            if (note.length > 500) { showToast('审稿意见最多 500 字'); return; }

            var btns = document.querySelectorAll('.detail-actions .btn');
            for (var i = 0; i < btns.length; i++) btns[i].disabled = true;
            try {
                var res = await api('/api/submission/' + curId, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: status, review_note: note }),
                });
                if (res.status === 401) { handle401(); return; }
                var data = await res.json().catch(function () { return {}; });
                if (!res.ok) { showToast(data.error || '操作失败，请重试'); return; }
                showToast('已更新为「' + statusLabel(status) + '」');
                await loadSubs();
                await openDetail(curId);
            } catch (e) {
                showToast('网络错误，请重试');
            } finally {
                var btns2 = document.querySelectorAll('.detail-actions .btn');
                for (var j = 0; j < btns2.length; j++) btns2[j].disabled = false;
            }
        }

        // ===== 启动：有口令直接进面板，没口令先过口令门 =====
        if (token()) showPanel(); else renderGate();
    </script>
</body>
</html>
